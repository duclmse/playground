[[case]]
path = "calls.lua"
category = "calls"
status = "pending"
requires = []
note = "blocked-on: 'any value is valid for _ENV' (line 415) - `assert(load(\"return _ENV\", nil, nil, 123)() == 123)` requires a loaded chunk's `_ENV` to be an arbitrary value (here the integer `123`), not just a table, and the very next section ('load when _ENV is not first upvalue', line ~418) requires `_ENV` to be a genuine, `debug.getupvalue`-visible upvalue at all. Sol's Lua-compat compiler has no such representation: `lua_runtime/value.rs`'s `Globals` is unconditionally backed by an `RcRef<LuaTable>` (`GlobalsInner.table`), global reads/writes are dispatched through it directly rather than desugared to `_ENV.name` access against a real captured upvalue, and `natives.rs`'s `NativeFunction::Load` arm only accepts `LuaValue::Table` for its `env` argument (arg #4), silently falling back to the ambient globals for anything else. Making this pass needs `_ENV` modeled as a real upvalue holding an arbitrary `LuaValue` (with indexing that errors for a non-table `_ENV` the same way any other non-table index would) - a compiler/runtime architecture change out of scope for this pass. Everything before that line in the 'test for generic load' section now passes: `debug.getinfo(a).source` accepts a function value and reports the chunkname given to `load` (`chunk_sources`, keyed by `Proto` pointer identity, registered by the new `compile_chunk_named`/`register_chunk_source`); `load`'s mode argument (`\"b\"`/`\"t\"`/default `\"bt\"`) is now checked against whether the source looks like a binary chunk (starts with the `0x1B` signature byte), matching real Lua's `checkmode` and its exact 'attempt to load a text/binary chunk (mode is ...)' wording; `string.dump` is implemented as a same-process opaque handle into a new `dumped_protos` registry (Sol has no portable bytecode-file format to actually serialize a `Proto` into), round-tripping through `load(..., \"b\")` and rejecting non-Lua-closure arguments; and the parser's two generic 'token can't start a statement/expression' fallback errors now include the literal phrase 'unexpected symbol', matching real Lua's `lparser.c` wording that the corpus matches via `string.find`. The prior blocker here (the reader-function form of `load`'s first argument) remains fixed; see `dynamic_lua_runtime_load_accepts_a_reader_function_that_returns_pieces`/`dynamic_lua_runtime_load_reader_returning_nil_immediately_yields_an_empty_chunk`/`dynamic_lua_runtime_debug_getinfo_accepts_a_function_value_and_reports_loads_chunkname`/`dynamic_lua_runtime_load_rejects_a_text_chunk_in_binary_mode`/`dynamic_lua_runtime_string_dump_round_trips_through_load_in_binary_mode`/`dynamic_lua_runtime_load_syntax_error_reports_unexpected_symbol` in `crates/sol/tests/lua55_dynamic_runtime.rs`. `debug.getinfo`'s returned table's `extraargs` field and the O(1) tail-call/iterative resolution of chained `__call` metamethods (`step_result_for_call`, `MAX_CALL_CHAIN`) both continue to work as previously documented, covering the entire 'testing chains of __call' section (line 195) and the 'C-stack overflow while handling C-stack overflow' section (line 160)."

[[case]]
path = "closure.lua"
category = "closures"
status = "pass"
requires = []
note = "Previously blocked at line ~140: a loop-body local captured as an upvalue by a nested closure could be re-assigned the SAME register number as an earlier-compiled, textually-preceding scratch temp within the same loop body (e.g. a `while` guard condition), because ordinary stack-discipline register recycling only protected *already-captured* registers (`retired_floor`) going forward, not registers a still-open loop had used earlier in its own body. Fixed by adding `LoopCtx.reg_floor` (`lua_bytecode/func_state.rs`): the highest register any `alloc_reg` call has handed out anywhere in the current loop's body, which now also floors `reset_to`/`pop_scope`/`end_statement`'s recycling for as long as that loop is being compiled. Also required precisely fixing the top-level `function NAME(...) end` chunk-statement hoisting decision in `parser.rs`: it now hoists into the independently-compiled `functions` list (which can never capture a chunk-scope local as an upvalue) only when the function's name doesn't rebind a preceding chunk-local and a conservative free-variable scan of its body finds no reference to one; otherwise it stays a sequential `Stmt::GlobalFunction` chunk statement, matching real Lua's assignment-sugar semantics for `function NAME(...) end`. Oracle-backed: matches the pinned reference `lua5.5.1` byte-for-byte (aside from Sol's documented top-level return echo) when run standalone from within `lua-5.5.1-tests/`."

