et (1,000,000, sized for untrusted code) is exhausted mid-file in the \"testing attack on table length\" hash-collision stress section, an orthogonal, pre-existing budget-sizing gap rather than a compatibility bug, so this case cannot be reclassified from `pending` to `pass` (which the corpus runner exercises under default budgets) without first addressing that. The upstream file's `T`-gated (ltests) sections are already skipped gracefully by upstream code when `T` is absent, so that is not an independent blocker on its own. Re-tested under this case's own elevated `budget`/`alloc_budget` overrides (the same low-risk, already-precedented mechanism `sort.lua` uses, rather than touching `sol run`'s product-wide sandboxed-embedder defaults): the file progresses well past the former default-budget exhaustion point and into the 'testing next with all kinds of keys' section (line 479), where it surfaced one more genuine, previously-masked bug, now fixed: `LuaValue::key()`/its companion `LuaKey` enum (`value.rs`) explicitly handled every `LuaValue` variant used as a table key except `Userdata` and `LightUserdata`, so indexing a table with a userdata key (e.g. `[io.stdin] = 9`, a file handle) fell through to the generic 'table index has an unsupported type' catch-all instead of keying by the userdata's object identity the way `CanonicalTable`/`CFunction` already did. Fixed by adding `Userdata`/`LightUserdata` arms to `LuaKey`, its `PartialEq`/`Hash` impls, `LuaValue::key()`, and `LuaKey::value()` (mirroring the existing `object_id()`-based identity used for `CanonicalTable`), which also let the now-exhaustive match in `key()` drop its unreachable catch-all arm entirely. With that fixed, the file runs to completion and prints `OK` under the budget override, matching the oracle line-for-line except two pre-existing, unrelated, cosmetic differences: the file's own `math.randomseed()`-derived seed-report line is inherently non-deterministic (differs between any two runs, oracle