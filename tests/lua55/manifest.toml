et (1,000,000, sized for untrusted code) is exhausted mid-file in the \"testing attack on table length\" hash-collision stress section, an orthogonal, pre-existing budget-sizing gap rather than a compatibility bug, so this case cannot be reclassified from `pending` to `pass` (which the corpus runner exercises under default budgets) without first addressing that. The upstream file's `T`-gated (ltests) sections are already skipped gracefully by upstream code when `T` is absent, so that is not an independent blocker on its own."

