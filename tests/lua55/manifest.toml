[[case]]
path = "goto.lua"
category = "control-flow"
status = "pending"
requires = []
note = "blocked-on: `<close>` requires resource finalization, which is not implemented yet (fails at line 280); scheduled for Phase 4 alongside GC/weak tables."

[[case]]
path = "heavy.lua"
category = "stress"
status = "pending"
requires = []
note = "blocked-on: this test's toomanyidx() loop (`for i = 1, math.huge do a[i] = i end`, expecting an eventual catchable out-of-memory pcall error) used to false-pass in ~8ms because Sol's numeric for loop only supported integer control values and errored on the float `math.huge` limit before the loop body ever ran - fixed this session (ForPrep/ForLoop now run a float-mode loop when any control value is a float). With that fixed, the loop now runs for real and instead hits Sol's non-catchable instruction budget (`Lua instruction budget exhausted`, escapes the inner pcall), since Sol has no real allocation-tracked out-of-memory error a pcall can catch - that remains a Phase 4/GC-adjacent gap."

[[case]]
path = "literals.lua"
category = "syntax-and-values"
status = "pending"
requires = ["debug-library"]
note = "blocked-on: `local debug = require \"debug\"` at line 8 (also used inline via require\"debug\".getinfo at lines 38/249); require is sandboxed to explicitly pre-registered in-memory modules and Sol has no debug library implementation to register."

[[case]]
path = "locals.lua"
category = "scope-and-attributes"
status = "pending"
requires = []
note = "blocked-on: `<close>` requires resource finalization, which is not implemented yet (fails at line 250); scheduled for Phase 4 alongside GC/weak tables."

[[case]]
path = "main.lua"
category = "standalone-cli"
status = "host-required"
requires = ["standalone-cli", "shell", "filesystem", "stdin"]
note = "Tests the Lua executable's command-line, stdin, and shell behavior."

[[case]]
path = "math.lua"
category = "math-library"
status = "pending"
requires = []
note = "blocked-on: the `math.huge << 1` field-name provenance and the `tonumber` most-negative-integer boundary (`\"-9223372036854775808\"`) now match the reference; the next differential failure is hex-float parsing for very long numerals (`tonumber('0xe03' .. string.rep('0', 1000) .. 'p-4000')`), an arbitrary-precision-adjacent edge case in the hex-float lexer/parser."

[[case]]
path = "memerr.lua"
category = "c-api"
status = "host-required"
requires = ["c-api", "allocation-failure-injection", "ltests"]
note = "Injects allocation errors through Lua's internal C test API."

[[case]]
path = "nextvar.lua"
category = "tables-and-globals"
status = "pending"
requires = []
note = "blocked-on: math.random/math.randomseed's xoshiro256** behavior, the former line-335 blocker, the table-iteration stress section, native argument-count validation's \"bad argument\" wording (checkerror(\"bad argument\", pairs) at line 398), and `next`/`pairs` traversal after tombstoning a deleted key mid-iteration are all now fixed (the last was `LuaTable::hash`'s `std::HashMap` silently reordering its iteration order on a same-key overwrite when an internal capacity-growth rehash happened to trigger; fixed by switching to `indexmap::IndexMap`, which never repositions an existing key). The former line-581 blocker (`table.insert`/`table.remove` only ever splicing the array-part `Vec` directly, invisible to live integer keys - `0`, negatives, or anything past the array part's contiguous prefix - held in a table's hash part) and the former line-613 blocker (the whole table library, most notably `table.sort`'s coroutine-yield-safe stepped implementation, reading/writing a table argument's raw storage directly instead of respecting `__index`/`__newindex`/`__len` on a \"proxy\" table) are also now fixed, by rewriting `table.insert`/`remove`/`concat`/`unpack`/`sort` in terms of new metamethod-aware `LuaRuntime::index_get`/`index_set`/`length_of` helpers (blocking wrappers around the existing non-blocking `index_resolve`/`set_index_resolve`/`len_resolve` primitives), including matching real Lua's C-integer wraparound when a `__len` reports `math.maxinteger`. Under unlimited resource budgets the case now advances past the entire \"testing table library with metamethods\" and \"testing overflow in table.insert\" sections and fails later, at line 742, in the \"testing floats in numeric for\" section (mixed int/float `for`-loop control-value semantics) - not yet root-caused. The upstream file's `T`-gated (ltests) sections are already skipped gracefully by upstream code when `T` is absent, so that is not an independent blocker on its own."

[[case]]
path = "pm.lua"
category = "pattern-library"
status = "pass"
requires = []
note = "Oracle-backed: unchanged Lua 5.5.1 case matches the pinned reference, including pattern errors/frontiers, callable and table gsub replacements, empty-match progression, and source-string identity reuse."

[[case]]
path = "sort.lua"
category = "table-library"
status = "pending"
requires = []
note = "blocked-on: table.create's hash-size hint (2nd arg) isn't honored (fails at line 35, `assert(memdiff > 1024 * 12)`; observed memdiff was only 32 bytes) - no hash-part preallocation actually occurs."

[[case]]
path = "strings.lua"
category = "string-library"
status = "pending"
requires = ["locale"]
note = "blocked-on: an unrelated assertion later in the file (`error: assertion failed!`, not yet isolated to a line - `debug.sethook`/`io.stderr` aren't implemented, which rules out the usual line-tracing tricks). The prior blocker here - string.rep hanging indefinitely on huge repeat counts (e.g. `string.rep('aa', math.maxinteger)`) instead of erroring \"resulting string too large\" - is fixed (crates/sol/src/lua_runtime.rs's StringRep now checks against a fixed size ceiling before charging the allocation budget); the string.rep test block (lines 94-124) now passes in isolation."

[[case]]
path = "tpack.lua"
category = "tables-and-multireturn"
status = "pending"
requires = []
note = "blocked-on: string.pack/string.unpack's 'X' alignment option is not supported; matches Phase 2's documented delivered-scope exclusion, not a new bug."

