E = 60`-byte budget. Rewrote `short_src` to match `luaO_chunkid`'s exact per-form truncation arithmetic (`=name` keeps the first 59 bytes verbatim with no ellipsis; `@path` keeps the last 56 bytes behind a `\"...\"` prefix; a literal source chunk is wrapped `[string \"...\"]`, keeping its first line verbatim under a 45-byte budget or truncating to that budget plus `\"...\"`), verified byte-for-byte against the pinned oracle across all three forms, and made `display_chunk_name` delegate to it instead of keeping its own separate logic, so `debug.getinfo` and `load()`'s error prefix now agree the way real Lua's two call sites into `luaO_chunkid` do. See `chunk_name_truncation_matches_reals_luao_chunkid_for_equals_at_and_string_sources` in `crates/sol/tests/lua55.rs`. Past `checksize`, the file's `lineerror` helper (checking both the position and substring of a series of expected runtime-error messages) surfaces further gaps, re-investigated and mostly resolved: the note's original claim that generic-`for`'s `TForCall` iterator-call error (a non-callable iterator expression, line 431's `for k,v in 3 do ... end`) \"gets no position prefix at all\" was stale even at the time the scratch bisection moved past it - `runtime_error_prefix` (added earlier in this same note's history) already applies unconditionally to any implicit runtime error regardless of `call_base`, so the position prefix was already correct. Only the second half of the original claim, the missing `(for iterator 'for iterator')` name annotation, was a real, still-open gap: `describe_register`-based `annotate_call_error` requires a `call_base` register to resolve a name from, but `drive_result`'s `call_base` match (`dispatch.rs`) only handled `Pending::Call`/`Pending::TailCall`, falling through to `None` for `Pending::TForCall` and so skipping the annotator entirely. Fixed by adding a `Pending::TForCall { base, .. } => Some(base as Reg)` arm, and special-casing `annotate_call_error` to hardcode `(for iterator 'for iterator')` when the failing call's instruction is `Instr::TForCall` - matching real Lua's `funcnamefromcode` (`ldebug.c`), which hardcodes `namewhat`/`name` to the literal \"for iterator\" for `OP_TFORCALL` rather than tracing the callee register's origin (the iterator slot is a fixed calling-convention position, not a named variable). Verified byte-for-byte against the pinned oracle; see `a_non_callable_generic_for_iterator_names_itself_for_iterator` in `crates/sol/tests/lua55.rs`. This does not by itself change `errors.lua`'s stopping point, since line 431's own assertion only substring-matches \"to call\" and never required the name annotation - but line 432's sibling case (`for k,v in \\n 3 \\n do ... end`, iterator list starting on a later source line than the `for` keyword) remains genuinely blocked by a separate, narrower line-attribution bug: `TForCall`'s bytecode line comes from the whole `Stmt::GenericFor`'s single `line` field (the `for` keyword's line, set once in `parser.rs` and reused for every instruction the statement lowers to), not the iterator list's own first line the way real Lua's `forlist()` captures `line = ls->linenumber` right after consuming `TK_IN` (already pointing at the first iterator expression). Fixing this without touching the other `Stmt::GenericFor` call sites (`ast.rs`/`binder.rs`/`closures.rs`/`typeck.rs`/etc.) that share the same `line` field for their own, unaffected purposes was not attempted here; still neutralized in `crates/sol/scratch/errors_bisect.lua`. Separately, the note's claim that a dotted function-statement declaration (`function a.x.y() ... end`) reports its index error at the closing `end`'s line instead of the `function` keyword's line was also stale - re-verified directly against the pinned oracle (`lineerror(\"function a.x.y ()\\na=a+1\\nend\", 1, \"index\")`) and it already reports line 1 correctly; un-neutralized in `crates/sol/scratch/errors_bisect.lua` now that it's confirmed passing. Continuing the bisection past the `checksyntax` cluster (lines 686-697, now passing) surfaced a significant, previously-undetected regression unrelated to this file's own stopping point: `dispatch.rs`'s `unwind_error_to_marker` returned immediately, without visiting any frame, whenever no enclosing `pcall`/`xpcall` marker exists anywhere on the stack - silently dropping every discarded frame's line number from an uncaught top-level error's traceback except the innermost one, even though real Lua's own `lua` CLI always shows the full call chain here too (it wraps the whole script in its own top-level protected call with a `msghandler`/`luaL_traceback`). Fixed by having the no-marker branch walk `self.frames[base_depth..]` the same way the marker-found branch does, appending each frame's position via a new `LuaError::at_outer_frame` (`value.rs`, inserting at the front rather than `at`'s append, since outer levels are discovered after the innermost one and `Display`'s `.rev()` needs them in call order) without popping or closing any frame, preserving `drive`'s contract that `self.frames` is left untouched here for `close_frames_above` to handle afterward. See `an_uncaught_error_with_no_enclosing_pcall_still_records_every_frames_position` in `crates/sol/tests/lua55.rs`. Two smaller gaps came out of the same pass: `assert(condition, nil)` (an explicit `nil` message, as opposed to an omitted one) fell through to the generic `Some(message)` arm and re-raised the raw `nil` instead of the same `\"<no error object>\"` conversion `error(nil)` already applied - fixed by adding a `Some(LuaValue::Nil)` arm to `NativeFunction::Assert` mirroring `Error`'s; and `os.exit(code)` discarded any output `print`/`io.write` had already buffered (`std::process::exit` bypasses the CLI's normal `take_output`-based flush paths) - fixed by flushing the buffered output straight to `std::io::stdout()` first. Separately, extending the `checksyntax`-style `near '<token>'`/`near <eof>` suffix to the parser's `expect`/`expect_ident` primitives (used for cases like `for >> do end`/`syntax error`) surfaced that those functions are shared by both Sol's own syntax and Lua-compatibility parsing, so the suffix had to be gated behind a new `Parser::lua_near_suffix` helper (a no-op under `sol_extensions`) to avoid breaking `frontend_conformance.rs`'s expectation that Sol's own annotation-syntax errors stay suffix-free; the lexer's own invalid-byte error gained the same suffix (decimal-escaped `<\\N>`, matching `txtToken`), and `natives_load.rs`'s `is_eof_table_diagnostic`/`lua_syntax_message` needed to strip the new suffix before their exact-string-match special-casing for `load()`'s end-of-input-inside-table-constructor rewrite. See `checksyntax_style_errors_report_the_lua_compatible_near_suffix` in `crates/sol/tests/lua55.rs`. With the near-suffix fix landed, the file's line-280-onward `for i=1,1000 do doit('a = '); doit('a = 4+nil') end` loop (immediately before the \"testing syntax limits\" section) exposed a genuine, unrelated `call_depth` accounting leak, found by isolating it in `crates/sol/scratch/` repros down to a minimal case: `pcall` catching a plain, directly-raised runtime error (e.g. `4 + nil`, no nested call involved) never released that erroring frame's own `call_depth`/`depth_charged` charge, because `dispatch.rs`'s `drive_result` pops the erroring frame off `self.frames` before its `Err(mut error) =>` arm runs and never re-pushes it (unlike the sibling `PushClosure`-overflow arm, which explicitly re-pushes for exactly this reason) - so `unwind_error_to_marker`'s `removed = self.frames.len() - marker_index` frame count never saw it, under-releasing `call_depth` by one unit per caught error. This leaked one budget unit per `doit('a = 4+nil')` call, cumulatively exhausting the default 1000-unit `max_call_depth` budget by the time the file's \"testing syntax limits\" section ran its first ordinary, shallow `testrep` call - a call that does no deep recursion at all, which is what made the earlier failure look unrelated to call depth. Fixed by releasing the erroring frame's own charge in that same `Err(mut error) =>` arm, gated by the same `self.frames.len() > base_depth` condition `finish_frame` already uses for a normal return (a bare base frame's charge belongs to `call`'s own bookkeeping, not `depth_charged`, so it must not be double-released here). See `pcall_catching_a_plain_runtime_error_does_not_leak_call_depth_budget` in `crates/sol/tests/lua55.rs`. With that fixed, the file's own `for i=1,1000 do ... end` loop and the \"testing syntax limits\" section's first several `testrep` calls (lines 804-808) now pass, and the file advances to line 799-801's `testrep(\"return \", \"(\", \"2\", \")\", 2)`-style helper's `load(gencode(500))` assertion: real Lua's parser enforces a recursion-depth limit on nested constructs (`LUAI_MAXCCALLS`, checked by `luaY_syntaxerror`'s `\"too many\"`/`\"C stack overflow\"`-style diagnostics wired through `enterlevel`/`leavelevel` in `lparser.c`) so that 500 levels of nested parentheses/local-variable lists fail to parse at all, but Sol's own parser has no equivalent nesting-depth check and instead accepts 500 levels outright at line 794's inner `load(gencode(100))` step already passing (untested at 500 until this line) - not yet investigated further; this is a new, distinct gap (a missing parser recursion-depth limit, not a runtime `call_depth` issue) and is the file's current stopping point. Refined and partially fixed: reading the pinned Lua 5.5.0 C source directly (`lparser.c`/`lcode.c`, via the `lua-src` crate's vendored copy) showed the first three `testrep` variants at this stopping point (lines 804-806, all `local` declaration-list forms) actually fail in real Lua for a narrower reason than `LUAI_MAXCCALLS` recursion depth: `MAXVARS` (200), a flat cap on a function's live local-variable count checked once per variable as it enters scope (`adjustlocalvars`'s `luaY_checklimit`), independent of any parser nesting. Implemented the equivalent in Sol's `.lua`-compatibility bytecode compiler - `FuncState::check_local_variable_limit`/`declare_local_checked` (`crate/sol/src/lua_bytecode/func_state.rs`), called from every site that pushes a new local onto a scope (`Stmt::Local`/`MultiLocal`/`NumericFor`/`GenericFor`/`LocalFunction` in `compile_stmt.rs`, plus parameter/vararg binding in `mod.rs`'s `compile_function`) - deliberately only the flat 200-variable count, not real Lua's separate `MAX_FSTACK` (255) \"too many registers\" register-pressure check or its C-stack parser-recursion-depth limit, both of which stay unimplemented as noted below. See `a_function_with_too_many_local_variables_fails_to_compile` in `crates/sol/tests/lua55.rs`. With that fixed, lines 804-806 now correctly fail to compile at `gencode(500)`, and the bisection's actual remaining stopping point is line 807 (`testrep(\"local a; a\", \",a\", \"= 1\", \",1\")`, \"multiple assignment\" - a plain assignment to 500 repeated `a` targets, not a local declaration, so untouched by the `MAXVARS` fix). Verified against the pinned oracle (`/tmp` probes, not committed) that this case, and the remaining `testrep` variants after it (constructors, parentheses, nested calls, `do`/`while`/`if` blocks, function declarations, string concatenation, exponentiation - lines 807-816), all genuinely do fall under real Lua's `LUAI_MAXCCALLS`-style C-stack recursion-depth-during-parsing behavior as originally described above (each reports plain `\"C stack overflow\"` from the pinned oracle, not a `MAXVARS`/register-count message), so that attribution stands for everything past line 806 - only the specific local-declaration-count piece needed correcting/narrowing. Sol does not crash or hang on any of these inputs (confirmed via manual probes); it simply accepts them where real Lua would reject them, which is the remaining, still-deferred gap - a parser nesting-depth limit is architecturally harder to add correctly given Sol's AST-first (not recursive-descent-with-C-stack) parsing model and real Lua's own limit being platform/build-dependent in the first place, so it remains unimplemented rather than being approximated. Continuing the bisection past that cluster (neutralized only in `crate/sol/scratch/errors_bisect.lua`, never the real corpus file) reached line 819's `checkmessage(\"a = f(x\" .. string.rep(\",x\", 260) .. \")\", \"too many registers\")`: real Lua also caps a function's register-stack window at `MAX_FSTACK` (255, `lcode.c`'s `luaK_checkstack`), a distinct resource from `MAXVARS`, and Sol had no equivalent - `Reg` is a `u16` with far more headroom, so a call needing more than 255 live registers (261 call arguments, each needing its own register slot) compiled and ran instead of failing. Fixed narrowly: `FuncState` already tracked `max_reg` (the peak register-stack depth ever reserved via `alloc_reg`, incidentally already the exact equivalent of real Lua's own peak-usage `maxstacksize`), so `Compiler::compile_function` (`crate/sol/src/lua_bytecode/mod.rs`) now rejects a function whose final `max_reg` exceeds 255 with a \"too many registers\" message, checked once per function after its body finishes compiling rather than incrementally per-allocation like real Lua's `luaK_checkstack` (equivalent end effect for a `load()`-time compile failure, and far less invasive than threading a `Result` through `alloc_reg`'s ~50 call sites across `compile_expr.rs`/`compile_stmt.rs`/`compile_calls.rs`). See `a_function_using_too_many_registers_fails_to_compile` in `crates/sol/tests/lua55.rs`. With that fixed, the bisection advanced to line 858's upvalue-count stress test (`local function fooA() local a1..a127,b,c; local function fooB() local b1..b127,b; function fooC() return b+c+a1+b1+...+a127+b127 end end end`, expecting `\"too many upvalues\"`): real Lua also caps a function's upvalue count at `MAXUPVAL` (255, `lparser.c`'s `newupvalue`), which Sol has no equivalent of - `FuncState::add_upval` (called only from `Compiler::resolve` in `mod.rs`) is infallible. Fixed in a later pass: real Lua's code generator frees/reuses a temporary register as soon as a binary operation folds it into its accumulator (`lcode.c`'s `freeexp`), so a long `a1+b1+a2+b2+...` addition chain only ever needs a couple of live registers at a time, but Sol's expression compiler was found (via this exact case) to allocate a fresh register per intermediate result without freeing the previous one - so with the `MAX_FSTACK` fix now in place, Sol was hitting its own 255-register cap first on this stress shape and reporting \"too many registers\" instead of real Lua's \"too many upvalues\". Fixed by adding `FuncState::free_reg(reg, floor)` (`crate/sol/src/lua_bytecode/func_state.rs`) - reclaims `reg` back into `next_reg` only if it's at or above `floor` (the `next_reg` snapshot taken before the operand that produced it was compiled, so an active local's or an outer expression's own register, always below that snapshot, is never touched) and is the topmost currently-allocated register, mirroring real Lua's `freeexp`/`freereg` (`lcode.c`)'s own `lua_assert(reg == fs->freereg)` LIFO invariant. Wired into `compile_expr.rs`'s binary (including `and`/`or`), unary, `#`, indexing, and field-access cases: each frees its operand register(s), right-to-left, right before allocating its result register, so a long chain reuses a small constant number of registers instead of growing `max_reg` linearly with chain length. See `a_long_left_associative_expression_chain_reuses_registers_instead_of_growing_without_bound` in `crates/sol/tests/lua55.rs` (a 399-term addition chain, well within anything real Lua would reject, that used to trip Sol's own `MAX_FSTACK` cap and now compiles and evaluates correctly). This fix does not change `errors.lua`'s own upvalue stress test outcome, though, and re-investigating it after this fix uncovered a *different*, previously-masked root cause: with the addition-chain register growth gone, that stress test's inner `fooC` closure no longer trips `MAX_FSTACK` itself, but its enclosing `fooB` now does, at a much lower name count (127 locals) than either `MAXVARS` (200) or `MAX_FSTACK` (255) should allow for a function declaring that few locals. Root cause (separate from anything above, now fixed): `Stmt::MultiLocal`'s compilation (`compile_stmt.rs`) was allocating *two* registers per declared local instead of one - `compile_expr_list` first computed each initializer (or, with no initializers at all, a nil pad) into its own freshly allocated register, and then the `MultiLocal` loop allocated a *second*, distinct register per name for `Instr::NewLocal`'s destination, permanently doubling a function's register cost per plain `local` declaration relative to real Lua's single-register-per-local `lparser.c`/`luaK_exp2nextreg` scheme. Confirmed via a minimal isolated repro (a single function declaring ~127 plain locals with no initializers at all, no nested closures or upvalues involved) that this alone crosses `MAX_FSTACK`, and confirmed it predates this session's register-reuse fix entirely (reproduces identically on the pre-fix tree; it was only ever masked by the fact that, before the `MAX_FSTACK` check existed at all, an oversized register file silently worked instead of being caught). Fixed by compiling each initializer directly into its own final, pre-reserved slot register via `compile_into` (mirroring `compile_call_args`'s already-proven fixed-destination-register pattern in `compile_calls.rs`) instead of a separate temporary - `compile_into` reserves through the target register first, so an initializer that aliases a *pre-existing* outer variable's own register (e.g. `local a, b = someOuterA, someOuterA + 1`) is unaffected, since the target register is always chosen strictly above every currently-live register and so can never numerically collide with an outer variable's; a trailing multi-value initializer is handled the same way `compile_call_args` handles one, via `reset_to` plus `compile_expr_multi_n`. `Instr::NewLocal(dst, dst, name)` then reuses that same register in place (safe because `reg_set_fresh` reads the source value before rebinding the destination cell's identity, so a self-referential freshen is safe even when source and destination are numerically the same register). Verified correct (not just smaller) for outer-variable aliasing, swaps (`local a, b = b, a`), self-shadowing (`local a = a`), excess/deficient initializer counts, and a trailing multi-value expression with nothing left to fill - see `a_multi_name_local_declaration_uses_one_register_per_local_not_two` and `a_multi_name_local_declaration_evaluates_aliasing_initializers_correctly` in `crates/sol/tests/lua55.rs`. With both of those genuinely fixed (not just neutralized in the scratch bisection), this stress test now reaches - and correctly rejects - the actual `MAXUPVAL` condition it was written to exercise: `fooC` needs 256 upvalues, one past the 255 limit. Implemented as a post-hoc check on the finished upvalue count (`Compiler::compile_function` in `mod.rs`, right next to the pre-existing `MAX_FSTACK` check), rather than making `FuncState::add_upval` itself fallible - `add_upval` never fails, and a function that ends up over budget is rejected once compilation finishes, the same way an over-budget register file already was; this avoids threading a `Result` through `resolve`, which is also reached via `resolve(level, \"_ENV\")` from `emit_environment_get`/`emit_environment_set`, `()`-returning functions used by every plain global variable read/write, not just this narrow case. Real Lua's exact wording (\"in function at line 5 near 'end'\") isn't fully reproduced (no \"near '<token>'\", and Sol's outer `[string ...]:N:` position uses the function's own definition line rather than real Lua's separate current-parse-position line), but the message does include the literal \"line 5\" substring, which - together with \"too many upvalues\" - is enough to satisfy this corpus's own compound assertion (`string.find(b, \"too many upvalues\") and string.find(b, \"line 5\")`) unmodified. See `a_function_with_too_many_upvalues_fails_to_compile` in `crates/sol/tests/lua55.rs`. The register-reuse fix itself also surfaced (and required fixing) a real naming regression: once a binary/field/index operation's operand registers are freed and reallocated, its result register can numerically coincide with its own operand register (e.g. `a._ENV.x` now compiles to `GetField(r0, r0, \"_ENV\"); GetField(r0, r0, \"x\")`, both self-overwriting `r0` - confirmed via `luac5.5 -l` to be exactly real Lua's own `GETFIELD` codegen shape for this expression, not a Sol-only artifact). `describe_register`'s existing \"chase through a self-overwriting field chain back to its root\" special case (`crate/sol/src/lua_runtime/dispatch.rs`, added for `compile_name_into`'s dotted-call-name lowering, e.g. `foo.bar.baz(...)`) could not distinguish that shape from an ordinary nested field-access chain hitting the same bytecode pattern, and started misreporting `a._ENV.x + 1`'s nil-field error as `\"global 'a'\"` instead of `\"field 'x'\"`. Confirmed against the pinned `lua5.5` oracle across several shapes (`aaa.bbb:ddd()`, `aaa.bbb.ccc:ddd()`, `foo.bar.baz()`, `foo.bar.baz.qux()`) that real Lua's own `getobjname` never chases through a `GETFIELD` to name some earlier receiver - it always names the most recently written field, so the chase-to-root special case was based on a mistaken premise even before this fix (it happened to go untriggered for the one pre-existing test that exercises this wording, `dotted_root.bad_field:bad_method()`, because that test's failure is a direct index-of-nil at the very first `GetField`, requiring no chase either way). Fixed by removing the chase-to-root branch entirely, keeping only the legitimate, unrelated `_ENV`-rebinding recursion (a lexically rebound `_ENV.name` field load must still report as `\"global 'name'\"`, matching real Lua). See `a_binary_operations_error_names_its_last_field_not_its_reused_register_root` in `crates/sol/tests/lua55.rs`. Continuing past that (neutralized in the scratch file only) reached the file's final stress case (line 891, 201 locals declared in a function body with a deliberately *missing* closing `end`, expecting `\"too many local variables\"` at `\"line 2\"` - the function's own declaration line): this surfaces a fourth, more fundamental gap rather than a fixable bug - real Lua's single-pass parser reports `MAXVARS` violations mid-parse, before it ever looks for a matching `end`, but Sol's `.lua` front end must fully parse a function into a complete, syntactically-valid AST (`end` included) *before* the later, separate compilation pass (where the `MAXVARS` fix lives, in `lua_bytecode`) ever runs - so an incomplete function body always surfaces its own \"unexpected end of input\" syntax error first, regardless of any resource-limit violation earlier inside it. This is a general consequence of Sol's two-phase parse-then-compile pipeline versus real Lua's single-pass parse-and-codegen (the same underlying reason the parser recursion-depth limit above is awkward to add), not specific to `MAXVARS`, and is not attempted here; the `MAXVARS` fix itself is unaffected for every syntactically-complete input. Of the four gaps this bisection originally found, two (the register-reuse gap and the `MultiLocal` double-register bug) are now genuinely fixed - the real corpus file itself progresses past both without any scratch-only workaround - and a third (the `MAXUPVAL` check) is also now genuinely implemented, so only the remaining two architectural gaps (the parser recursion-depth limit and the missing-`end` `MAXVARS` case) still needed neutralizing in the scratch bisection copy to reach the end of the file. The parser recursion-depth gap is now genuinely fixed too: `Parser::enter_level`/`leave_level` (`parser.rs`) add a shared depth counter mirroring real Lua's `nCcalls`/`LUAI_MAXCCALLS` (`lparser.c`'s `enterlevel`/`leavelevel`), checked in `parse_stmt` (each statement, so nested `do`/`if`/`while`/`for`/function bodies recurse through it) and `parse_precedence` (each expression descent, covering parenthesized expressions, unary operator chains, and nested calls), and additionally charged - without Sol's own recursion, since this one list is parsed with a loop - once per extra item in `parse_assign`'s repeated-assignment-target list, mirroring `restassign`'s own per-target recursion; plain value lists (`explist`-style: return statements, local-declaration initializers, assignment values) are not charged, matching real Lua's own `explist`, which has no `enterlevel` call. This closes the gap for all ten `testrep` variants at this stopping point (lines 807-816, including the multiple-assignment case previously singled out as architecturally distinct) and, more importantly, fixes a real crash: previously, sufficiently deep nested input (well beyond anything this corpus file tests, but easy to construct) recursed through Sol's own Rust call stack without bound until the whole process aborted with a stack overflow, rather than failing gracefully with a parse error - the earlier note's reasoning that this would be "architecturally harder to add" given Sol's AST-first parsing model did not hold up once examined directly, since `parse_stmt`/`parse_precedence` are themselves genuinely recursive regardless of being AST-first. See `a_parser_stops_recursing_before_the_rust_stack_overflows` in `crates/sol/tests/lua55.rs`. Only the missing-`end` `MAXVARS`-ordering case remains neutralized (only in the scratch bisection copy, with its own explanatory comment - the real corpus file and this note's findings are unaffected by that scratch-only workaround); with it, `errors.lua` now runs to completion end-to-end and prints `OK`, matching the pinned oracle's own final line - `status` stays `pending` rather than `pass` since the real, un-neutralized corpus file still fails at that one remaining, genuinely architectural gap (Sol's two-phase parse-then-compile pipeline surfacing the missing `end` syntax error before the later compile pass ever sees the `MAXVARS` violation). U6 update (2026-10-01): item (a) above (the `table.sort`/`string.gsub` callback-provenance gap) is now genuinely fixed, not merely bisected around. Root cause: `LuaRuntime::resolve_call` (`dispatch.rs`) is the single dispatch choke point for every call issued by native Rust code rather than by a bytecode `Instr::Call` - `push_native_call` (covering `pcall`/`xpcall`'s protected function, and any native continuation's very first comparator/replacement-function step, whether that continuation was itself just entered from bytecode or reentered from another native call), the `NativeCont::Sort`/`NativeCont::Gsub` resume arms in `drive` (every later comparator/replacement-function step), and `resume_coroutine` (a coroutine's body, its very first call) all funnel through it - and by construction, none of the callees it resolves have a bytecode call site of their own (that naming instead happens over on the separate `CallLeaf`/`annotate_call_error`/`annotate_bad_argument_error` path for an ordinary bytecode-issued call). Confirmed against the pinned Lua 5.5.1 oracle that this is a uniform rule, not specific to `table.sort`/`string.gsub`: `pcall(string.sub, 'a', {})`, `pcall(table.sort)`, and `coroutine.resume(coroutine.create(table.sort))` all report a qualified `'table.sort'`/`'string.sub'` name too, the same `pushglobalfuncname` fallback real Lua's `luaL_argerror` (`lauxlib.c`) uses whenever `lua_getinfo(L, \"n\", &ar)` finds no traceable call site - while an ordinary bytecode-issued `table.sort({1,2,3}, 5)` keeps the bare `'sort'` name, since that callee *is* the one named at an actual call site. Implemented by adding `LuaRuntime::global_function_name` (searches `self.globals`'s table entries, then one level into each nested table, for an exact `LuaValue` match - mirroring real Lua's own `package.loaded`/`_G` search, using `table_entries` (`table.rs`), previously dead code) and `qualify_callback_argument_error` (rewrites an existing `\"bad argument #N to 'BARE'\"` message's name portion to the qualified one when they differ, a no-op otherwise or if already qualified), then applying the latter unconditionally inside `resolve_call`'s own two error-producing arms (the `CallLeaf` call's `Err`, and the top-level `step_result_for_call` `Err`) before `unwind_error_to_marker` converts the error into a caught-pcall resume value or propagates it - `resolve_call`'s existing internal unwind is exactly why a naive fix applied *outside* this function (e.g. wrapping its call sites) never took effect: an error reaching an enclosing `pcall`/`xpcall` marker is already converted to `Ok(CallStep::Done(...))` before `resolve_call` returns, so any qualification attempted by its caller runs too late, on a value that no longer looks like an error at all. Separately fixed two narrower, pre-existing bugs surfaced while chasing this: `table.sort`'s own `expect_table` argument check (both the resumable `dispatch.rs` and blocking `natives_table.rs` `TableSort` arms) propagated a completely unwrapped \"table expected, got N\" message with no \"bad argument #1 to 'sort' (...)\" wrapping at all, unlike the sibling missing-argument check just above it; and `NativeFunction::SetMetatable`'s argument validation checked arg 2 (the metatable) before arg 1 (the value)'s type and used non-standard wording, where real Lua's `luaB_setmetatable` (`lbaselib.c`) checks arg 1's type first and treats an *omitted* arg 2 (`LUA_TNONE`) as a distinct \"no value\" failure from an *explicitly passed* `nil` (accepted, same as a table) - both rewritten to match real Lua's exact four boundary-case messages, verified against the pinned oracle. See `crates/sol/tests/lua55.rs`'s updated `bad_argument_errors_on_a_method_calls_self_argument_use_reals_calling_on_bad_self_wording` (its `pcall(string.sub, 'a', {})` case now correctly expects the qualified `'string.sub'`, not the stale bare `'sub'` the assertion previously - incorrectly, relative to the pinned oracle - encoded); the full `crates/sol/tests/lua55.rs` suite and `scripts/test-lua55-manifest.sh` both still pass with this change. With item (a) fixed, the file's real, un-neutralized stopping point is now item (b) (line 397, the recursive-`coroutine.create`/`resume` \"C stack overflow\" wording versus Sol's unified \"stack overflow (Lua call-depth budget exhausted)\" - still unattempted, see that item's original description above); item (c)'s missing-`end`/`MAXVARS`-ordering architectural gap remains as previously described."

