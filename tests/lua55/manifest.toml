ased identity for strings past the 40-byte short-string cutoff reports the same address for all of them. Runtime-computed strings (concatenation, `string.format`, etc.) are untouched and still allocate their own `Rc`, so `sd`'s address correctly stays distinct. Regression coverage: `identical_long_string_literals_share_identity_across_nested_functions`, tests/lua55.rs. With this fixed, the file runs on to line 338's `malformednum` helper (`local s, msg = load(\"return \" .. n); assert(not s and string.find(msg, exp))`), which surfaced a second, independent, now also-fixed bug: Sol's malformed-numeral lexer errors said \"malformed numeral\" where real Lua's `llex.c` (`read_numeral`'s `lexerror(ls, \"malformed number\", TK_FLT)`) says \"malformed number\" - a plain wording fix across all 6 call sites in `crates/sol/src/lexer.rs` (regression coverage: `lexer_reports_a_malformed_number_not_a_malformed_numeral`, tests/lua55.rs) - unblocking `malformednum(\"0xep-p\", ...)`/`malformednum(\"1print()\", ...)`. The file's new stopping point is `malformednum(\"0xe-\", \"near <eof>\")` (line 341): `load(\"return 0xe-\")` correctly fails to compile (a trailing `-` with nothing after it), but the error is a *parser*-level \"unexpected symbol\" error (`parser.rs`'s generic expression-error site, not `lexer.rs`), and Sol's parser does not yet append the `near '<token>'`/`near <eof>` diagnostic suffix the way `lexer.rs`'s `Scanner::error_near` does for lexer-level errors - real Lua's parser gets this for free because `luaX_syntaxerror` (used by both the lexer and the parser) always calls through the same `lexerror`/`txtToken`. Extending near-text to the parser's own error sites is a distinct, broader change (the parser doesn't have `lexer.rs`'s byte-position context, and would need a `Token`-to-canonical-text mapping akin to `luaX_token2str` covering every token kind, not just the handful of escape/digit-validation cases `error_near` currently covers) - not yet attempted; `literals.lua` stays `pending` for that reason. This is now fixed: `Spanned` already carries each token's exact source bytes in a `lexeme` field (used for contextual-keyword spelling and formatting), so the parser's two generic \"unexpected symbol\" fallbacks (`parse_stmt`, `parse_primary`) needed no new token-to-text table at all - `Parser::near_suffix`/`Parser::format_near` just read that lexeme directly (falling back to `near <eof>` when the failing point is genuinely end-of-input), mirroring `lexer.rs`'s `error_near` but built on the already-decoded token stream instead of raw byte offsets. `malformednum(\"0xe-\", \"near <eof>\")` (line 341) now passes, and with it the unmodified upstream file runs to completion and prints `OK`, matching the pinned `/opt/homebrew/bin/lua5.5` (`Lua 5.5.1`) oracle's own run. `status = \"diverges\"` rather than `pass`: two purely cosmetic output differences remain, both pre-existing and unrelated to this fix. (1) `os.setlocale(\"pt_BR\")`/`os.setlocale(\"ptb\")` (line 299) always fails in Sol - a deliberate, already-documented design choice (`natives_os_io.rs`'s `OsSetlocale`: Sol has no real locale-sensitive collation, so only `\"\"`/`\"C\"` ever succeed, exactly the outcome real Lua would have on a system lacking that locale, which the file's own `trylocale`-style guard is written to tolerate) - so Sol always takes the file's own 'pt_BR locale not available' skip branch and prints its notice, where the pinned oracle happened to have that locale installed on this machine and skipped the notice instead. (2) `sol run`'s own CLI harness prints the top-level chunk's return value (`nil` here, since the file ends on a bare `print('OK')`) as a trailing line after the script's own output - a general, pre-existing artifact of every `sol run` invocation, not specific to this file (confirmed present for other already-`pass` cases too, e.g. `closure.lua`). Neither affects the file's own assertions, which all pass. See `parser_reports_the_lua_compatible