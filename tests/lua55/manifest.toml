[[case]]
path = "gc.lua"
category = "garbage-collection"
status = "pass"
requires = []
budget = 50000000
alloc_budget = 268435456
note = "`local debug = require'debug'` (line 6) now succeeds (see `events.lua`'s note for why - `debug` has been preloaded for a while). The original line-15 blocker (`assert(collectgarbage(\"generational\") == \"incremental\")`) is also fixed: `collectgarbage(\"incremental\"|\"generational\"|\"stop\"|\"restart\"|\"isrunning\"|\"param\", ...)` now track real mode/running/pause/stepmul bookkeeping state (`gc_mode`/`gc_running`/`gc_pause`/`gc_stepmul` on `LuaRuntime`) and return the previous mode/value like real Lua's `lua_gc`, instead of always returning a bare integer. Re-verified 2026-09-27 after the U2 tables/closures/coroutines cutover (`docs/features/table-closure-coroutine-cutover.md`): the former line-64 blocker (`assert(gcinfo() < x)` inside `dosteps`) is fixed as a side effect of that migration - `sol_core::Heap` only reclaims a table on an actual tracing sweep, matching real Lua's lazy-sweep timing. The former line-71 blocker (`assert(dosteps(10) < dosteps(2))`, `collectgarbage(\"step\", siz)` previously ignoring `siz` and always running a full collection) is now fixed by `Heap::step_major_with_conditional_roots`'s genuine resumable incremental stepping (bounded per-call work proportional to a budget, tracked via `IncrementalPhase`/`IncrementalCycle` across calls), wired into `CollectGarbage(\"step\")`. The file now runs through 'creating many objects', 'functions with errors', 'long strings', 'clearing tables', and the entire 'weak tables' section (previously blocked by two further bugs, both now fixed: (1) `sweep_weak_tables` was dropping a weak-*valued* string entry outright instead of exempting strings - interned, not heap-tracked, so they never need weak-value collection - from the sweep, matching real Lua's `iscleared` treating strings as always-alive for this purpose; (2) a general register-retirement GC-root leak in the Lua-mode bytecode compiler: a local/temporary's register was only ever *bookkept* as free once its scope/statement ended, never physically cleared, while `push_lua_frame_roots` unconditionally roots a frame's entire fixed `regs` array - so a table used only as a weak-table key/value inside a loop body (this file's `for i=1,lim do local t={}; a[t]=t end` idiom) stayed spuriously reachable via the stale register for the rest of the enclosing call. Fixed by emitting explicit `Instr::LoadNil` clears at every point the compiler's register-recycling drops `next_reg` (`Compiler::end_statement`, `FuncState::pop_scope`, and - since a compile-time-only `next_reg` reduction at an `if`/`else` or `while` condition's control-flow join/branch point can't be tagged with a single line safe for every path - dedicated per-branch/per-entry clears in `Stmt::If` and `Stmt::While` as well, each tagged with a line that's already the active `debug.sethook(\"l\")` line on that specific path). The file then ran into a `__gc`-plus-weak-`kv`-table ordering gap at line 457 (`u`'s `__gc` finalizer, set up alongside a `__mode=\"kv\"` weak table on its own metatable `m.x`, never ran, so the sentinel `m = 10` the following `assert(m==10)` checks was never set) - root-caused and fixed: `table_set_metatable` (`lua_runtime/table.rs`) only registered a table for finalization when its new metatable's `__gc` field was already *callable*, but this test attaches a non-function placeholder (`setmetatable(u, {__gc = true})`) and only later overwrites `getmetatable(u).__gc` with the real function via a plain field write (not another `setmetatable` call) - real Lua's `luaC_checkfinalizer` registers on mere *presence* of a non-nil `__gc` field at `setmetatable` time and defers the callability check to actual finalization time, so the registration gate now checks presence instead of callability, matching that two-phase semantics; the weak-`kv` sweep-before-finalize ordering itself was already correct once the finalizer actually ran. The former line-477 blocker (`assert(collectgarbage(\"count\") <= m + 1)`, inside a \"string keys in weak tables\" block allocating two ~4MB weak-table-keyed strings) is now also fixed - it was not the suspected `TableObject` capacity-retention issue previously recorded here, but a simpler, more consequential bug: `sol_core::object_byte_footprint`'s `String` arm (`crate/sol-core/src/heap.rs`) charged every string's fixed baseline cost as `size_of::<HeapObject>()` - the whole enum, sized to its largest variant (`TableObject`, 136 bytes) - instead of `String`'s own natural representation (`Vec<u8>`, 24 bytes), inflating `collectgarbage(\"count\")` by ~112 bytes per live string. Fixed by charging `size_of::<Vec<u8>>()` instead, matching every other arm's convention of charging its own variant's size rather than the enum's. That, in turn, reached a new blocker at line 540: an ordinary, shallow `coroutine.resume` spuriously raised \"stack overflow (Lua call-depth budget exhausted)\" inside this file's 'testing next with self-referenced threads' stress section (1000 simultaneously live, merely-suspended coroutines, each kept alive on purpose via a closure upvalue). Root-caused: `LuaRuntime::call_depth` is a single global counter, and `resume_coroutine` only ever released a coroutine's own pending-frame charge (`depth_charged`) against it on error, never on an ordinary yield - so every simultaneously-suspended-but-idle coroutine ever created kept permanently occupying the one shared recursion budget, unlike real Lua, where an idle coroutine's own stack costs nothing until it is resumed again. Fixed in `resume_coroutine` (`crate/sol/src/lua_runtime/coroutine.rs`) by restoring the charge to `call_depth` at the start of each resume and releasing it again on every yield (previously only done on error/normal completion), verified not to break the existing yield-then-error depth-accounting regression test. (A registry-cleanup gap surfaced and fixed alongside this: `CoroutineRegistry::remove` was dead code, so a genuinely unreachable coroutine's registry entry leaked forever; `gc.rs` now has a `prune_dead_coroutines` pass, run after every full/step collection, that evicts registry entries for coroutines the heap no longer reports as live - this needs no `call_depth` adjustment of its own, since the yield-time release above already guarantees an unreachable coroutine's charge was never still outstanding.) With that fixed, the file reached one final blocker at line 704, in a test titled \"check that the collector is not reentrant in incremental mode\": a `__gc` finalizer calling `collectgarbage()` was expected to return `false` per real Lua's non-reentrant-collector semantics, but Sol's `CollectGarbage` native had no reentrancy guard and attempted a genuine nested collection. Fixed by adding a `gc_finalizing: bool` flag to `LuaRuntime` (set for the duration of `run_gc_finalizers`'s `__gc`-invocation loop) checked at the top of `CollectGarbage`'s `\"collect\"`/`\"step\"` arms, short-circuiting to `Ok(vec![LuaValue::Bool(false)])` when already finalizing. With all of the above fixed, the file now runs to completion end to end and prints `OK` under this case's own raised `budget`/`alloc_budget` (the sandboxed-embedder default instruction budget is legitimately exhausted mid-file, at line 100, on this file's own stress-sized allocation loops - an orthogonal, pre-existing budget-sizing gap, not a compatibility bug, the same already-precedented mechanism `sort.lua`/`nextvar.lua` use). Full crate test suite re-verified with zero regressions after all of the above."

[[case]]
path = "gengc.lua"
category = "garbage-collection"
status = "pass"
requires = []
note = "`local debug = require'debug'` (line 6) now succeeds - `debug` has been preloaded for some time (see `init.rs`'s `self.preload(b\"debug\", ...)`), and the stale claim otherwise was corrected here. The file never reaches the T-gated generational-GC-internals tests (T.gcage/T.newuserdata/T.codeparam/etc, lines ~10-158) because Sol has no `T` test-library global, so the `if not T then print(...); print 'OK'; return end` guard (~line 130) short-circuits that part of the file before any of it runs, same as a stock `lua5.5` build without the `testC` library compiled in - this is not a Sol-specific gap. This entry previously recorded a real assertion failure at line 122 (the `-- bug introduced in commit 9cf3299fa` weak-table block): `collectgarbage(\"step\")` had no true generational minor-collection fast path at all - it always mapped to `Heap::step_major_with_conditional_roots`, a bounded slice of one slow major mark-and-sweep cycle, so a weak-value entry pointing at now-garbage young data took up to 148 consecutive `\"step\"` calls to clear instead of real Lua's near-immediate one. That gap is now closed for real: `sol_core::Heap` gained a genuine young-generation-only minor collector (`collect_minor_with_conditional_roots`/`collect(CollectionKind::Minor, ...)`, per-object `GcGeneration::Young`/`Old` tracking, a `remembered: HashSet<ObjectId>` write-barrier set, and `should_trace_during_minor`'s remembered-or-young trace gate), and `collectgarbage(\"step\")` now dispatches to it directly under `collectgarbage(\"generational\")` mode (`lua_runtime/gc.rs`'s `step_garbage`) rather than always stepping the incremental major cycle. Validating this fix against the real pinned corpus file (not a synthetic reproduction) surfaced and fixed two further real regressions, both in `sol_core::Heap`'s new minor-collection path rather than in the original weak-table fix itself: (1) `drain_mark_queue`'s young/remembered skip gate could silently drop a suspended coroutine's `conditional_roots` frame contents (Rust-side proxy roots consulted only inside `trace_object`'s `Thread` arm, not real write-barrier-covered graph edges) whenever the coroutine's own `ThreadObject` was `Old` and unremembered - fixed by always tracing an id that has pending `conditional_roots`, regardless of the generational skip. (2) More fundamentally, a minor collection's initial mark phase only seeded its queue from real roots, never from `self.remembered` itself - so an `Old` object that had gone unreachable from any current root this round (its owning local out of scope, say) was never enqueued at all, even though minor collections unconditionally spare every live `Old` object from reclamation regardless of reachability (deferred to the next major sweep); its `remembered` write-barrier edge to a `Young` child (e.g. its own metatable) was therefore never walked, and that child was incorrectly swept as garbage out from under the still-alive `Old` parent, producing a dangling `ObjectId` a later finalizer or field read would panic on (`\"TableRef must address a live table object\"`). Root-caused via truncation-based bisection against the real corpus file (never print-injection, which perturbs allocation timing and thus GC promotion/collection behavior non-equivalently) down to `gengc.lua`'s block 3 (the `gcf` finalizer test, lines 56-81: `obj`'s own metatable becomes unreachable-but-still-`remembered`-from once `obj = nil` drops the only root, one minor collection intervenes before the next major collection resurrects and finalizes `obj`). Fixed by seeding the minor collection's mark queue with every `self.remembered` member up front, the same way real Lua's generational GC treats its remembered/\"gray again\" list as additional roots for a minor cycle. With both fixes in place, the unmodified upstream file now runs end to end under `sol run` with default budgets, exits 0, and prints `OK`; this case is promoted to `pass`. See `crates/sol/tests/lua55_dynamic_runtime_gc.rs`'s `dynamic_lua_runtime_generational_mode_clears_weak_entries_in_a_single_step` and `dynamic_lua_runtime_minor_collection_traces_remembered_old_objects_unreachable_from_roots` for focused regression coverage of the minor-collector fix and both regressions found while validating it. Full `crates/sol`/`crates/sol-core` test suites re-verified with zero regressions."

[[case]]
path = "goto.lua"
category = "control-flow"
status = "pass"
requires = []
note = "blocked-on: goto/label duplicate-label and scope-violation validation is implemented in `lua_bytecode.rs`'s dynamic-runtime compiler - `FuncState` tracks a live active-local count per scope (mirroring real Lua's `fs->nactvar`), clamps a bubbled-out pending goto's count to its closing scope's starting count (matching `movegotosout`), and compares goto/label counts in `check_goto_scope` to reject both duplicate labels and a `goto` that jumps into a local's scope, with the same `\"<goto NAME> at line L> jumps into the scope of 'V'\"` message real Lua uses. `global *`/`global none` declarations also now register as goto-scope pseudo-locals (`BlockScope.global_decls`, `FuncState::declare_global_pseudo`) so a goto skipping one is caught the same way, matching `errmsg([[ goto l2; global *; ::l1:: ::l2:: print(3) ]], \"scope of '*'\")` at line 30 - see `crates/sol/tests/lua55_dynamic_runtime.rs`'s `dynamic_lua_runtime_rejects_a_duplicate_label_*`/`dynamic_lua_runtime_rejects_a_goto_that_jumps_into_the_scope_of_a_local`/`dynamic_lua_runtime_rejects_a_goto_that_jumps_into_the_scope_of_a_global_star_declaration`/`dynamic_lua_runtime_allows_a_goto_to_skip_a_blocks_own_locals_*` tests. `debug.upvalueid` (the only `debug.*` call this file makes, used at lines 168-225 to assert upvalue-sharing topology across closures created inside a goto-driven loop) is now implemented too - a new `LuaValue::LightUserdata(usize)` variant wraps a closure's captured upvalue cell's `Rc::as_ptr` identity, `NativeFunction::DebugUpvalueid` extracts it from `LuaClosure.upvals`, and the `debug` table is installed like `os`/`io`/`coroutine` (always present as a global/preload entry, but the `upvalueid` call itself is gated on the existing `capabilities.debug` flag, previously unused) - see `dynamic_lua_runtime_implements_debug_upvalueid`/the `debug.upvalueid` line added to `dynamic_lua_runtime_gates_os_and_io_behind_explicit_capabilities`. Lua 5.5's fuller `global`-declaration strict-checking semantics (goto.lua lines ~296-474) are now implemented too: `global function NAME` declares (and activates) `NAME` as a global *before* compiling its body, matching real Lua's `globalfunc`, so the body's own recursive self-reference and any later use of the name resolve as the declared global rather than an outer local of the same name (previously `global function` never shadowed anything); and `global NAME = value`/`global function NAME` now run the runtime `\"global 'NAME' already defined\"` guard real Lua's `checkglobal`/`OP_ERRNNIL` requires whenever the target's current value is non-nil at the moment of declaration (a new `Instr::ErrorIfGlobalDefined`, checked via the same `_ENV`-aware read used for ordinary global access, so it also fires correctly through a rebound local `_ENV` table) - see `dynamic_lua_runtime_named_global_declaration_is_block_scoped_and_shadows_an_outer_local`/`dynamic_lua_runtime_declaring_env_as_a_named_global_poisons_all_global_access`/`dynamic_lua_runtime_env_is_exempt_from_the_strict_declared_check`/`dynamic_lua_runtime_global_function_declaration_shadows_an_outer_local_of_the_same_name`/`dynamic_lua_runtime_global_declaration_with_an_initializer_errors_if_already_defined`/`dynamic_lua_runtime_global_already_defined_check_also_applies_to_a_rebound_env_table`. `global none` rejecting an undeclared bareword global/function-statement target, globals rejecting `<close>`, and block-scoped declare-before-use enforcement were already covered by the existing goto-scope pseudo-local tracking. Both of this note's previously-recorded divergences at lines 329 and 361 are now fixed for real, in the actual lexer/parser/diagnostics source, not merely worked around in a scratch file. `global` is no longer reserved: the lexer (`lexer.rs`) always tokenizes it as a plain `Ident`, and the parser (`parser.rs`) only treats it as the `global` declaration keyword contextually, at the specific statement positions Lua's own non-instrumented (non-`T`/ltests) grammar reserves it - everywhere else (a table field, a local/global variable name, a label/goto target) it parses as an ordinary identifier, matching `load(\"global = 1; return global\")() == 1` at line 329. Chunk-name formatting was also centralized: parse-time and runtime `load()` errors now render through the same `chunkname:N:` prefix real Lua's `luaO_chunkid` produces (e.g. `[string \"...\"]:2: attempt to assign to const variable 'foo'`), so `checkerr([[ ... ]], \"%:2%:\")` at line 361 matches. With both fixed in the real source, the unmodified upstream file now runs end to end under `sol run`, exits 0, and prints `OK`; this case is promoted to `pass`."

[[case]]
path = "heavy.lua"
category = "stress"
status = "diverges"
requires = []
note = "The prior blocker (this test's `toomanyidx()` loop hitting Sol's non-catchable instruction-budget exhaustion instead of a real, pcall-catchable out-of-memory error) is now fixed: `LuaTable`'s array/hash growth is charged against the allocation budget at every genuinely-new-key write (`gc.rs`'s new `charge_new_table_entry`, called from `dispatch.rs`'s `set_index_resolve`/`raw_set_index` and `dispatch/bytecode.rs`'s `SetArrayMulti` handler whenever the pre-existing raw value at that key was `Nil`), with a `LuaTable::charged_bytes` field so `collect_cycles` credits the exact charged amount back on reclaim (avoiding regressions in small-budget GC tests that churn table fields across repeated `collectgarbage()` calls). An unbounded `a[i] = i` growth loop now raises a real `LuaError` (\"Lua allocation budget exhausted\") that a `pcall` catches normally, and execution continues correctly afterward - previously impossible, since instruction-budget exhaustion cascaded and poisoned all subsequent execution even past a successful `pcall`. With that fixed, the real unmodified upstream file (verified via `lua-5.5.1-tests.tar.gz`'s pinned corpus, not a synthetic reproduction) now runs `toomanyidx()` to completion and reaches `print \"OK\"` under an elevated `SOL_LUA_ALLOCATION_BUDGET`/`SOL_LUA_INSTRUCTION_BUDGET`, matching the pinned `/opt/homebrew/bin/lua5.5` oracle's own structural behavior (also raises a catchable error inside the same pcall, from its own `table overflow`, and reaches `OK`). `status = \"diverges\"` rather than `pass`: the exact error text (\"Lua allocation budget exhausted\" vs. real Lua's \"table overflow\") and the printed memory-usage numbers differ, since Sol's allocation-budget accounting and real Lua's `lua_gc`-reported memory are different, non-byte-comparable models - the same category of expected, unavoidable divergence already documented for `sort.lua`'s non-deterministic timing output. (Separately, `io.stderr` was entirely missing - fixed by adding a real `io.stderr` handle whose writes go straight to the process's actual stderr stream; general, also used by `all.lua`/`files.lua`/`main.lua`/`memerr.lua`.)"

[[case]]
path = "literals.lua"
category = "syntax-and-values"
status = "diverges"
requires = []
note = "`local debug = require \"debug\"` at line 8 is no longer a blocker (debug is preloaded); the inline `require\"debug\".getinfo`/`debug.getinfo` calls at lines 38/249 now work too via a new minimal debug.getinfo(level).currentline (dynamic_lua_runtime_debug_getinfo_reports_the_calling_frames_current_line). Also fixed two byte-oriented lexer bugs found while chasing this file: a literal vertical tab (0x0B) was not recognized as whitespace between tokens or while a `\\z` string escape skips whitespace, because Rust's `is_ascii_whitespace` deliberately excludes it unlike Lua's own `lisspace` (dynamic_lua_runtime_vertical_tab_and_form_feed_count_as_whitespace_including_inside_a_z_escape). The lexer's `near '<token>'`/`near <eof>` diagnostic suffix (`lexerror`/`txtToken`, `llex.c`) is now implemented too (`Scanner::error_near` in lexer.rs, covering every escape/digit-validation failure and unfinished-string/long-string case in `quoted`/`long_string`; regression coverage in `lexer_errors_report_lua_compatible_near_text`, tests/lua55.rs) - the file's ~30 `lexerror` calls (lines 78-122) all now pass, past the former line-85 stopping point. The former line-127 'valid characters in variable names' stopping point (byte 35, `#`) is fixed too: real Lua only skips a leading `#` shebang line inside `lauxlib.c`'s `luaL_loadfilex` (a file-loading helper), never inside the lexer (`llex.c`) or `lua_load`'s generic reader path used by `load()`, so Sol's lexer now takes a `skip_shebang: bool` (`Scanner::new`/`lex_bytes` vs. the new `lex_bytes_no_shebang`, threaded through `compile_chunk_named`) - `load()`'s call site passes `false` so `load(\"#=1\", \"\")` now correctly fails to compile (`#` parsed as the unary length operator, invalid at statement start) instead of silently succeeding as a no-op, while `dofile`/`require`'s Lua searcher still pass `true` and keep skipping a real shebang line (regression coverage: `load_does_not_skip_a_shebang_but_file_loading_still_does`, tests/lua55.rs). The unmodified upstream file now runs substantially further and reaches line 227, inside the `do -- reuse of long strings` block (lines 213-234): `assert(a1 == getadd(s2))` fails because Sol's compiler gives every string constant its own fresh allocation (`func_state.rs`'s `push_const`/`push_name_const` perform no deduplication at all), while real Lua's `llex.c` anchors every string token (`luaX_newstring`/`anchorstr`, using a `LexState`-scoped table `ls->h`, not a per-function one) so that any two byte-identical string tokens lexed anywhere within the same chunk - including across nested function bodies, like `s1`'s enclosing scope and `foo2()`'s own inline literal - share one `TString` object for the lifetime of that compile; this is separate from (and, since the test literal is 50 bytes, longer than `LUAI_MAXSHORTLEN`'s 40-byte cutoff, not explained by) real Lua's ordinary VM-wide short-string interning, and also separate from `lcode.c`'s per-`FuncState` constant-table cache (`fs->kcache`), which is too narrowly scoped to explain the cross-function sharing on its own. A `sd = \"0123456789\" .. \"01234...\"` runtime concatenation of equal content is correctly required to NOT share the address (line 233), confirming this is a compile-time/lexer-level phenomenon, not a general same-content-implies-same-object runtime invariant. This is now fixed: `crates/sol/src/lua_bytecode/mod.rs`'s `Compiler` (one instance per top-level chunk compile, shared across every nested function's own `FuncState` the same way real Lua's `LexState` is shared across a chunk's nested `FuncState`s) gained a `string_literals: HashMap<Vec<u8>, Rc<Vec<u8>>>` plus an `intern_string_literal` helper; `compile_expr.rs`'s `ExprKind::StringLit` case now interns through it instead of allocating a fresh `Rc` per token, so every string-literal token compiled anywhere in one chunk - including inside separately-compiled nested closures - shares one `Rc<Vec<u8>>`, and `%p`'s existing `Rc::as_ptr`-based identity for strings past the 40-byte short-string cutoff reports the same address for all of them. Runtime-computed strings (concatenation, `string.format`, etc.) are untouched and still allocate their own `Rc`, so `sd`'s address correctly stays distinct. Regression coverage: `identical_long_string_literals_share_identity_across_nested_functions`, tests/lua55.rs. With this fixed, the file runs on to line 338's `malformednum` helper (`local s, msg = load(\"return \" .. n); assert(not s and string.find(msg, exp))`), which surfaced a second, independent, now also-fixed bug: Sol's malformed-numeral lexer errors said \"malformed numeral\" where real Lua's `llex.c` (`read_numeral`'s `lexerror(ls, \"malformed number\", TK_FLT)`) says \"malformed number\" - a plain wording fix across all 6 call sites in `crates/sol/src/lexer.rs` (regression coverage: `lexer_reports_a_malformed_number_not_a_malformed_numeral`, tests/lua55.rs) - unblocking `malformednum(\"0xep-p\", ...)`/`malformednum(\"1print()\", ...)`. The file's new stopping point is `malformednum(\"0xe-\", \"near <eof>\")` (line 341): `load(\"return 0xe-\")` correctly fails to compile (a trailing `-` with nothing after it), but the error is a *parser*-level \"unexpected symbol\" error (`parser.rs`'s generic expression-error site, not `lexer.rs`), and Sol's parser does not yet append the `near '<token>'`/`near <eof>` diagnostic suffix the way `lexer.rs`'s `Scanner::error_near` does for lexer-level errors - real Lua's parser gets this for free because `luaX_syntaxerror` (used by both the lexer and the parser) always calls through the same `lexerror`/`txtToken`. Extending near-text to the parser's own error sites is a distinct, broader change (the parser doesn't have `lexer.rs`'s byte-position context, and would need a `Token`-to-canonical-text mapping akin to `luaX_token2str` covering every token kind, not just the handful of escape/digit-validation cases `error_near` currently covers) - not yet attempted; `literals.lua` stays `pending` for that reason. This is now fixed: `Spanned` already carries each token's exact source bytes in a `lexeme` field (used for contextual-keyword spelling and formatting), so the parser's two generic \"unexpected symbol\" fallbacks (`parse_stmt`, `parse_primary`) needed no new token-to-text table at all - `Parser::near_suffix`/`Parser::format_near` just read that lexeme directly (falling back to `near <eof>` when the failing point is genuinely end-of-input), mirroring `lexer.rs`'s `error_near` but built on the already-decoded token stream instead of raw byte offsets. `malformednum(\"0xe-\", \"near <eof>\")` (line 341) now passes, and with it the unmodified upstream file runs to completion and prints `OK`, matching the pinned `/opt/homebrew/bin/lua5.5` (`Lua 5.5.1`) oracle's own run. `status = \"diverges\"` rather than `pass`: two purely cosmetic output differences remain, both pre-existing and unrelated to this fix. (1) `os.setlocale(\"pt_BR\")`/`os.setlocale(\"ptb\")` (line 299) always fails in Sol - a deliberate, already-documented design choice (`natives_os_io.rs`'s `OsSetlocale`: Sol has no real locale-sensitive collation, so only `\"\"`/`\"C\"` ever succeed, exactly the outcome real Lua would have on a system lacking that locale, which the file's own `trylocale`-style guard is written to tolerate) - so Sol always takes the file's own 'pt_BR locale not available' skip branch and prints its notice, where the pinned oracle happened to have that locale installed on this machine and skipped the notice instead. (2) `sol run`'s own CLI harness prints the top-level chunk's return value (`nil` here, since the file ends on a bare `print('OK')`) as a trailing line after the script's own output - a general, pre-existing artifact of every `sol run` invocation, not specific to this file (confirmed present for other already-`pass` cases too, e.g. `closure.lua`). Neither affects the file's own assertions, which all pass. See `parser_reports_the_lua_compatible