note = "Measures Lua C-stack behavior through the internal test library."

[[case]]
path = "db.lua"
category = "debug-library"
status = "pending"
requires = ["debug-library"]
note = "Two successive blockers are now fixed. `debug.sethook`/`debug.gethook` (previously entirely missing) install/query/clear a per-coroutine hook via the dispatch loop's call/return/line/count hook events (`fire_hook`, `HookState`, `active_hook`/`running_hook` on `LuaRuntime`, `hook_last_pc`/`hook_last_line` per-frame tracking in `dispatch.rs`) - `assert(not debug.gethook())` and the central `test()` helper's `\"l\"`-mode line-tracing assertions (line 19 onward) pass. Past that, the file surfaced a distinct `debug.getinfo` completeness gap unrelated to hooks (line 39's `debug.getinfo(test, \"SfL\")`): `func` is now set to the exact closure value for the direct-function-value lookup case (`natives_debug.rs`'s `LuaValue::Closure` arm), `describe_lua_proto` now builds `activelines` as a line-to-`true` set from `proto.source_map`, and `LuaRuntime::set_chunk_name` (wired from all three `sol run` call sites in `main.rs`) registers a `chunk_sources` entry for the CLI's own top-level compile the same way `load` already does for a `load`ed chunk, so `debug.getinfo(1).source`/`.short_src` are no longer `nil` for the running main chunk either. Running against the pinned oracle past this fix surfaced two further, distinct compiler line-info gaps, both now fixed: (1) `lastlinedefined` was approximated as the maximum line number appearing anywhere in `proto.source_map`, not the actual line of the function's closing `end` token; fixed by adding `ast::Function::end_line` (populated at all 3 parser construction sites from the already-computed closing-token span) and a parallel `Proto::last_line_defined`, with `describe_lua_proto` now reporting it directly instead of scanning for a max. (2) `activelines[linedefined]` (the declaration line) was incorrectly `true` because the implicit `return` synthesized at the end of every function body, and the `CloseSlots` instruction emitted when popping the function's outermost scope, were both attributed to `function.line` (the declaration line) instead of `function.end_line` (the closing `end`'s line, matching real Lua's `luaK_ret`/`close_func` in `lparser.c`) - fixed in `Compiler::compile_function` (`crate/sol/src/lua_bytecode/mod.rs`). With both fixed, line 41-48's full `linedefined`/`lastlinedefined`/`activelines` boundary assertions now pass exactly against the oracle. Past that, line 57's `assert(#actl == 0)` required `string.dump(f, true)`'s strip flag to actually omit debug info from the dumped/reloaded closure; `Proto` is now `Clone` and `string.dump` honors `strip` by registering a proto clone with an empty `source_map` under its own dump-registry key (distinct from the original, still-running closure's full-debug-info proto) instead of always dumping the original - `linedefined`/`lastlinedefined` are left untouched by stripping, matching real Lua's `ldump.c` (they are not considered debug info). With that fixed too, the file now progresses through file/string chunkname truncation (lines 61-85) all the way to line 91's `assert(a.name == 'f' and a.namewhat == 'local')` on a level-based `debug.getinfo(2)` lookup - this needs real call-site name/namewhat resolution (real Lua's `funcnamefromcode` in `ldebug.c`, which walks the *caller's* bytecode at the call instruction to determine how the callee was referenced: global/local/upvalue/field/method). `natives_debug.rs` already documents this as a known, deliberate gap (only a callee's own declared-local-function name is resolved today; every other call form falls back to Lua's own nil/empty convention) - a substantially larger feature than the line-info fixes in this pass, so `db.lua` stays `pending` on it rather than being promoted. Implemented per `docs/features/call-site-name-resolution.md`: `describe_register` (`lua_runtime/dispatch.rs`) now returns a structured `(namewhat, name)` pair instead of a pre-formatted message, and a new `LuaRuntime::call_site_name` helper (`natives_core.rs`) resolves a frame's call-site name/namewhat by reading the *caller's* still-live `Pending::Call { base, .. }` and re-running `describe_register` against the caller's own bytecode at its paused `pc` - mirroring real Lua's `funcnamefromcode`, which always resolves a name from the calling instruction rather than the callee's own declaration. `NativeFunction::DebugGetinfo` now tries `call_site_name` first, falling back to the previous callee-declared-name heuristic only when there is no caller frame to inspect (e.g. the outermost frame, a native caller, or a tail call, which reuses the caller's frame in place and so leaves no call-site register to resolve from). A real gap surfaced while implementing this against the actual corpus: `describe_register` resolves names only by scanning backward for a write instruction, but Sol's bytecode never emits a write for a function *parameter* (its register is pre-populated by the calling convention itself, with no `Instr::NewLocal`) - so a call made through a parameter (`function g(x) ... x('a','x') ... end`) fell back incorrectly to the callee's own declared name. Fixed by adding `Proto::param_names` (populated in `compile_function` from `function.params`, the same pattern as the existing `upval_names`) and a terminal fallback in `describe_register`'s scan loop consulting it when no write was found - safe because a parameter's register lives in the function's outermost scope for the entire function body, never freed/reused for an unrelated temporary. With both fixed, `db.lua` now passes line 91's `assert(a.name == 'f' and a.namewhat == 'local')`, line 92's field-namewhat assertion, the line 96-98 parameter-call-site case, and line 104's reassigned-local-`f` case, advancing all the way to line 124 - the file's first call to its own `test(s, l, p)` helper, which drives `debug.sethook(f, \"l\")` to verify line-event traces. That call fails with `wrong trace!!` (the assertion inside `f`, `db.lua:25`): a genuine, substantial, and entirely separate gap in the existing `debug.sethook` `\"l\"`-mode line-hook implementation's trace accuracy, unrelated to call-site name resolution and not investigated as part of this fix. `db.lua` stays `pending` on that new blocker. That `\"l\"`-mode trace-accuracy gap turned out to be three distinct bugs, all now fixed: (1) `LuaFrame::hook_last_pc`/`hook_last_line` were only updated inside `fire_line_and_count_hooks` while a hook was already active, so they sat stale at their construction-time sentinel the whole time no hook was installed; installing a fresh `\"l\"`-mode hook mid-frame (exactly `test`'s own `debug.sethook(f,\"l\"); load(s)(); debug.sethook()` idiom) then compared the frame's current line against that stale value on the very next instruction and misfired a spurious event - fixed in `NativeFunction::DebugSethook` (`natives_debug.rs`) by seeding every live `Frame::Lua`'s hook bookkeeping to its own current position when a line-mode hook is (re)installed on the running coroutine. (2) Sol's AST-first compiler tags every instruction - including synthetic control-flow jumps with no source token of their own (an `if`/`while`'s else-skip or back-edge jump, a `repeat`'s `until` test) - with the enclosing statement's own recorded start line; real Lua's single-pass `lcode.c` (`savelineinfo`) instead always uses `ls->lastline`, the line of the most recently *parsed* token, which for these synthetic instructions is the last real statement/condition already compiled, not the construct's opening keyword. Added `FuncState::last_line()` (`func_state.rs`, returning the line of the most recently emitted instruction - the direct equivalent of real Lua's `lastline` for an already-fully-parsed AST) and wired it into `Stmt::If`/`Stmt::While`/`Stmt::Repeat`'s synthetic jump emissions (`compile_stmt.rs`). Numeric/generic `for`'s own control instructions (`ForPrep`/`ForLoop`/`TForCall`) were verified against the oracle to already match real Lua's actual (surprising) behavior of tagging them with the loop's own opening line, so those were left as `*line`. (3) A closure (`local function`/`function`/a function expression) isn't observably created in real Lua until its whole body has been parsed - `codeclosure` emits `OP_CLOSURE` only then, tagged with that point's `lastline` (the closing `end`'s line) - but Sol tagged its `NewClosure` (and the `local function` form's forward-declaration `LoadNil`/`NewLocal` setup) with the declaration's own opening line instead; fixed in `compile_stmt.rs`'s `Stmt::GlobalFunction`/`Stmt::LocalFunction` and `compile_expr.rs`'s `ExprKind::Function` by using `function.end_line` (already tracked, see the `lastlinedefined` fix above) throughout. All three fixes were verified against the pinned oracle via targeted probes (`while`/`repeat`/numeric-`for`/generic-`for`, `goto`, nested-block-close, and closure-creation traces now match exactly) and are covered by a new regression test, `debug_sethook_line_events_match_real_luas_lastline_convention` (`crate/sol/tests/lua55.rs`). With all three fixed, `db.lua` advances well past line 124 through all ten of the file's simple top-level `test(...)` calls (`if`/`else`, a `local function` call, a nil-condition `if`, a `repeat`, a `do return end`, `while`, a `while`-with-`break`, numeric `for`, generic `for`) and into its large \"testing line info/trace with large gaps in source\" stress loop (lines 193-212), which deliberately splits a single arithmetic statement's operator from its operands across many blank lines. There it surfaces a fourth, narrower, and much more obscure line-attribution mismatch: real Lua's single-pass parser only *discharges* (emits code for) a binary expression's first operand when it consumes the operator token that follows it - by which point lookahead has already scanned past that operator into the second operand's own line - so the first operand's instruction, and the operator's own instruction, both end up tagged with whatever line the operator's *lookahead* had already reached, not the operand's own line (confirmed against `luac5.5 -l -l`'s bytecode dump: `a = b[1]|op|b[1]` split across three physical lines tags the *first* `GETI` with the operator's line, not the first operand's). Sol's AST-first compiler has no equivalent lazy-discharge sequencing to reproduce this from, and the pattern only arises from deliberately pathological source formatting (an operator separated from its operand by embedded newlines) that this stress test alone exercises - a disproportionate scope to chase further in this pass. `db.lua` stays `pending` on that new, narrower blocker."

[[case]]
path = "errors.lua"
category = "errors"
status = "pending"
requires = []
note = "the `local debug = require\"debug\"` at line 6 is no longer a blocker (debug is preloaded). Fixed two genuine bugs found while chasing this file: `error()`/`error(nil)` now default the message to nil and surface it as the string \"<no error object>\" from pcall/xpcall, matching real Lua's luaG_errormsg (dynamic_lua_runtime_error_with_no_message_or_a_nil_message_becomes_no_error_object); and `return` is now rejected unless it is the last statement in its block, matching Lua's retstat grammar (dynamic_lua_runtime_return_must_be_the_last_statement_in_a_block). A third, broader bug surfaced separately while chasing the file's later `checkmessage`/`checkerr` calls: `error(msg[, level])` and `assert`'s failure message never got real Lua's `luaL_where` position prefix (`\"{short_src}:{line}: \"`, e.g. `input:3: boom`) prepended to a string message at all - `error()`'s `level` argument was silently ignored entirely. Fixed by adding `LuaRuntime::where_prefix` (walks `self.frames` to the requested level the same way `DebugGetinfo`'s numeric-level lookup already does, then formats its `short_src`/current line, or returns `None` for a native frame, an out-of-range level, `level <= 0`, or a chunk with no registered source - matching `luaL_where`'s own silent empty-prefix fallback) and wiring both `NativeFunction::Error` and `NativeFunction::Assert` (a plain tail call into `error` in real Lua's `lbaselib.c`) through it. See `error_and_assert_add_a_luals_where_style_position_prefix` in `crates/sol/tests/lua55.rs`. This does not change this file's own stopping point (still line 309, below), since `checkmessage`/`checkerr` only substring-match, not anchor on, the prefix - but it is a correctness fix with much wider reach across the whole corpus's actual error-message *text*, previously silently missing its leading position everywhere. The lexer's `near '<token>'`/`near <eof>` diagnostic suffix (see literals.lua's note) also unblocks this file's `checksyntax` helper, which asserts on both that suffix and `load()`'s `chunkname:line:` prefix together (`^%[string \".*\"%]:%d: .- near %s$`) - the line-65 `checksyntax` call, previously this file's stopping point, now passes, and the file ran on to line 277 inside the `do -- named objects` block, where `checkmessage(\"return ~io.stdin\", \"on a FILE* value\")` failed: Sol's bitwise-NOT operator reported a generic \"number expected\" for a `FILE*` userdata operand instead of real Lua's \"attempt to perform bitwise operation on a FILE* value\". Fixed (`bitwise_not_on_a_non_number_operand_reports_the_operand_type`): the unary `BitNot` arm in `dispatch.rs`'s `unary_resolve` now builds the same `error_type_label`-based message the binary bitwise/arithmetic ops already used, while still preserving the more specific \"number has no integer representation\" message for a float operand with no exact integer value (checked via the error text, since `coerce_integer` produces that message distinctly from the generic `\"number expected\"` case). With that fixed, the file now runs on to line 309's `checkerr(\"^%?:%?:\", f, {})`, inside the `-- errors in functions without debug info` block: this loads a closure re-dumped with `string.dump(f, true)`'s strip flag and expects a runtime error raised inside it to report its location as literal `?:?` (real Lua's convention for a function with no debug info, from `lua_getinfo`'s `currentline`/`short_src` both being unavailable) rather than a real source position. Sol's dumped/reloaded closure does still run and does still error on the bad call, and (a separate bug, also now fixed: `arithmetic_on_a_plain_table_or_non_numeric_string_names_the_operand_type`) its message now correctly names the operand type (\"attempt to perform arithmetic on a table value\", matching real Lua's `luaG_typeerror`, instead of a non-standard \"attempt to perform arithmetic on incompatible Lua values\" that Sol's binary-arithmetic dispatch used to fall back to whenever the failing operand had no `__name` override), but it still has no `?:?:`-style location prefix at all - a distinct, unrelated, larger gap in how errors are attributed/formatted for closures with stripped debug info, not yet investigated. The remaining `checksyntax` cluster at lines 686-697 is not yet reached/verified, since the debug-info-stripped-closure bug is hit first. Investigated and fixed: the `?:?:` gap turned out to be a much broader one than just the stripped-debug-info case - Sol's VM-raised runtime errors (arithmetic on the wrong type, calling a non-callable, indexing nil, and so on) never got any position prefix at all, for *any* closure, stripped or not (`local f = function(a) return a + 1 end; pcall(f, {})` produced the bare message with no `input:1: ` prefix), unlike `error()`/`assert()`, which already had their own `where_prefix`-based prefix. Real Lua's `luaG_runerror`/`luaG_addinfo` apply this prefix automatically at the point any VM-internal error is raised, independent of `error()`. Fixed by adding `LuaRuntime::runtime_error_prefix` (`natives_core.rs`, alongside `where_prefix`): returns the literal `\"?:?: \"` when the raising frame's proto has an empty `source_map` (the stripped-debug-info signal `string.dump(f, true)` already sets), otherwise the same `\"{short_src}:{line}: \"` format `where_prefix` uses. Wired into the single frame-unwind catch site in `dispatch.rs`'s `drive` loop (`Err(error) =>`, the one place every VM-raised error passes through exactly once, at the innermost frame that raised it) - only applied when `error.value.is_none()`, which cleanly distinguishes an internally-synthesized error from an explicit `error()`/`assert()` call (both of those always construct `LuaError::raised(value, ..)` with `value: Some(..)`, so they're never double-prefixed). See `implicit_runtime_errors_get_an_automatic_position_prefix` in `crates/sol/tests/lua55.rs`; the full `crates/sol/tests/lua55.rs` suite and `scripts/test-lua55-manifest.sh` both still pass with this change. With it, `checkerr(\"^%?:%?:\", f, {})` (line 309) and its line-316 sibling both pass, and the file now advances to line 331's `checkmessage(s..\"; local t = {}; t:bbb()\", \"field 'bbb'\")`: after the RK-limit-forcing prefix of 1000 assignments, real Lua's `getobjname` degrades a method-call name resolution to a generic field name, but Sol's still reports it as a method (`attempt to call a nil value (method 'bbb')` instead of expected `...(field 'bbb')`) - a narrow, specific gap in the same call-site name-resolution machinery already deferred for `db.lua`'s `funcnamefromcode` gap (see that file's own note), not attempted here. Working around only that one line (in `crates/sol/scratch/errors_bisect.lua`, never the real corpus file), the file advances to line 369's `checkmessage(\"getmetatable(io.stdin).__gc()\", \"no value\")`: Sol's `io.stdin` metatable had no `__gc`/`__close` entry at all, so this failed with the unrelated \"attempt to call a nil value (field '__gc')\" instead. Fixed: real Lua's `liolib.c` installs the same `f_gc` C function under both `__gc` and `__close` on the file-handle metatable (`metameth[]`) - an ordinary, directly Lua-callable function that argument-checks its receiver (`tolstream`'s `luaL_checkudata`) like any other file method, not something only the collector/a `<close>` scope exit can invoke. Added `NativeFunction::FileGc` (`value.rs`/`natives.rs`/`natives_os_io.rs`) implementing that check (no-op on a valid `FILE*`, matching real Lua's own no-op for the standard streams, whose `closef` is unset), and installed it under both keys on `io.stdin`'s canonical metatable in `init.rs` - reusing one allocated `heap.alloc_native_callable` object for both keys, since Sol's `CFunction`/`NativeCallable` equality is object-identity-based (`value.rs`) and real Lua's `mt.__gc == mt.__close` (same underlying C function pointer pushed twice). Calling it required a small dispatch bridge: `CanonicalAdapter::import_native_function` allocates provider-0 native callables (`canonical.rs`), but `canonical_to_lua` reads any canonical `NativeCallable` back as a `LuaValue::CFunction`, and `call_c_function_outcome`'s `c_functions` registry is populated only for embedder-registered (provider 1/2) callables - so a provider-0 callable had no dispatch path at all. Added a narrowly-scoped special case in `call_c_function_outcome` (`dispatch.rs`) recognizing `provider == 0 && function == NativeFunction::FileGc as u32` and routing directly to `call_native`, rather than a general provider-0-to-`NativeFunction` reverse-conversion mechanism (`NativeFunction` has no `from_u32`/`TryFrom` impl). See `file_handle_metatable_exposes_a_callable_gc_and_close_with_a_filestar_argument_check` in `crates/sol/tests/lua55.rs`. With that fixed, the file advances to line 381's `checkmessage(\"aaa:sub()\", \"bad self\")` (and its line 382-383 siblings `string.sub('a', {})`/`('a'):sub{}`): real Lua's `luaL_argerror` (`lauxlib.c`) treats a method call specially - argument numbers exclude the implicit `self` (`arg--`), and if the decremented number reaches 0 (the self argument itself failed) the message becomes `\"calling 'NAME' on bad self (EXTRAMSG)\"` instead of `\"bad argument #N to 'NAME'\"`; Sol had neither the renumbering nor the rewording, and separately `string.sub`'s own argument checks used the generic, contextless `self.string()`/`self.integer()` coercion helpers, which produce a bare \"string expected\"/\"number expected\" with no `\"bad argument #N to 'NAME'\"` wrapping at all. Fixed in two parts: (1) added `checked_string`/`checked_integer` (`natives.rs`), thin wrappers around `string`/`integer` that format real Lua's `\"bad argument #N to 'FUNCTION' (TYPE expected, got TYPE2)\"` shape (preserving `coerce_integer`'s distinct \"number has no integer representation\" wording for a non-integral float rather than overwriting it), and switched `NativeFunction::StringSub` to use them; (2) added `annotate_bad_argument_error` (`dispatch.rs`), a post-hoc rewrite mirroring the existing `annotate_call_error`/`annotate_index_error` pattern - reusing `describe_register`'s bytecode-level call-site resolution at the same leaf-call error site, it detects when the failing call was a method call and, for any native function's already-`\"bad argument #N to 'NAME'\"`-shaped error (not just `string.sub`'s), decrements `N` by one and rewords to \"calling on bad self\" when `N` reaches 0 - a small, generically reusable mechanism, not a per-function special case. Verified against the pinned oracle for all three call shapes (`aaa:sub()` -> \"calling 'sub' on bad self (string expected, got table)\"; `string.sub('a', {})` -> \"bad argument #2 to 'sub'\"; `('a'):sub{}` -> \"bad argument #1 to 'sub'\", the start-argument renumbered down by one for the method-call form). See `bad_argument_errors_on_a_method_calls_self_argument_use_reals_calling_on_bad_self_wording` in `crates/sol/tests/lua55.rs`. Past that, the file surfaces three further, distinct, and disproportionately-scoped gaps, none attempted here: (a) line 385-386's `checkmessage(\"table.sort({1,2,3}, table.sort)\", \"'table.sort'\")`/`checkmessage(\"string.gsub('s', 's', setmetatable)\", \"'setmetatable'\")` name a native callback invoked with no Lua bytecode call site at all (`table.sort`'s comparator, `gsub`'s replacement function, both called directly from Rust-native code) - real Lua names these via `luaL_argerror`'s `pushglobalfuncname` fallback, a reverse lookup through `package.loaded`'s library tables for a value-identity match, synthesizing a qualified `\"table.sort\"`/unqualified `\"setmetatable\"` name; Sol's native call-site naming is entirely bytecode-driven (`describe_register`) and has no equivalent for a native-to-native invocation - and separately, many native argument-checks besides `string.sub` (e.g. `expect_table`, used by `table.sort`/`table.insert`/`table.move`/etc.) still produce a bare, unwrapped message even for an ordinary top-level call (`table.sort(5)` currently reports plain \"table expected, got number\", not \"bad argument #1 to 'sort' (...)\"), so this would need both a naming-fallback mechanism and much broader argument-check-message coverage to fix correctly. (b) line 405 (`assert(string.find(f(), \"C stack overflow\"))`, `f` recursively creating/resuming coroutines): real Lua distinguishes a value-stack-size overflow (\"stack overflow\", `luaD_growstack`) from a C-call-nesting overflow (\"C stack overflow\", `luaE_incCstack`/`LUAI_MAXCCALLS`, hit by recursive `coroutine.resume`/`pcall`/metamethod chains); Sol tracks one unified `call_depth` counter across all four of `dispatch.rs`'s call-depth-exhaustion sites and always reports \"stack overflow (Lua call-depth budget exhausted)\", with no analogous distinction to know which of the two wordings applies at which site (confirmed Sol does cleanly raise a catchable error for this repro already, just with the wrong text - not a hang or crash). (c) line ~429's `checksize` helper (`assert(msg:len() <= idsize)`, `idsize = LUA_IDSIZE - 1 = 59`) expects long chunk-name sources to be truncated to Lua's fixed `LUA_IDSIZE` debug-info buffer size the way real Lua's `luaO_chunkid` does; not investigated further, and lines past it were not bisected in this pass. All three are individually neutralized (with an explanatory comment, never silently deleted) in `crates/sol/scratch/errors_bisect.lua` to let the bisection continue past each; the real corpus file and this note's stopping point are unaffected by that scratch-only workaround. Item (c), the `checksize` gap, is now fixed: Sol had two independent, diverging implementations of real Lua's single `luaO_chunkid` (`lobject.c`) chunk-name-display formatter - `LuaRuntime::short_src` (`natives_debug.rs`, used by `debug.getinfo`) and `display_chunk_name` (`natives_load.rs`, used by `load()`'s syntax-error prefix) - each with its own off-by-one/wrong-threshold truncation bugs relative to the real `LUA_IDSIZE = 60`-byte budget. Rewrote `short_src` to match `luaO_chunkid`'s exact per-form truncation arithmetic (`=name` keeps the first 59 bytes verbatim with no ellipsis; `@path` keeps the last 56 bytes behind a `\"...\"` prefix; a literal source chunk is wrapped `[string \"...\"]`, keeping its first line verbatim under a 45-byte budget or truncating to that budget plus `\"...\"`), verified byte-for-byte against the pinned oracle across all three forms, and made `display_chunk_name` delegate to it instead of keeping its own separate logic, so `debug.getinfo` and `load()`'s error prefix now agree the way real Lua's two call sites into `luaO_chunkid` do. See `chunk_name_truncation_matches_reals_luao_chunkid_for_equals_at_and_string_sources` in `crates/sol/tests/lua55.rs`. Past `checksize`, the file's `lineerror` helper (checking both the position and substring of a series of expected runtime-error messages) surfaces further gaps not yet fixed: generic-`for`'s `TForCall` iterator-call error (a non-callable iterator expression) gets no position prefix at all and no `(for iterator 'for iterator')` name annotation (both of which real Lua's `luaG_typeerror`/`getobjname` supply), apparently because its blocking call bridge (`LuaRuntime::call`, via `Pending::TForCall`) raises its error on a path that bypasses the single frame-unwind prefixing catch site in `dispatch.rs`'s `drive` loop; and a dotted function-statement declaration (`function a.x.y() ... end`) reports an index error on its nonexistent target prefix at the closing `end`'s line instead of real Lua's `function` keyword line (real Lua evaluates the assignment target's prefix lookup, from desugaring to `a.x.y = function() ... end`, before compiling the closure body). Neither is fixed yet; both are neutralized in `crates/sol/scratch/errors_bisect.lua` to let the bisection continue. Continuing the bisection past the `checksyntax` cluster (lines 686-697, now passing) surfaced a significant, previously-undetected regression unrelated to this file's own stopping point: `dispatch.rs`'s `unwind_error_to_marker` returned immediately, without visiting any frame, whenever no enclosing `pcall`/`xpcall` marker exists anywhere on the stack - silently dropping every discarded frame's line number from an uncaught top-level error's traceback except the innermost one, even though real Lua's own `lua` CLI always shows the full call chain here too (it wraps the whole script in its own top-level protected call with a `msghandler`/`luaL_traceback`). Fixed by having the no-marker branch walk `self.frames[base_depth..]` the same way the marker-found branch does, appending each frame's position via a new `LuaError::at_outer_frame` (`value.rs`, inserting at the front rather than `at`'s append, since outer levels are discovered after the innermost one and `Display`'s `.rev()` needs them in call order) without popping or closing any frame, preserving `drive`'s contract that `self.frames` is left untouched here for `close_frames_above` to handle afterward. See `an_uncaught_error_with_no_enclosing_pcall_still_records_every_frames_position` in `crates/sol/tests/lua55.rs`. Two smaller gaps came out of the same pass: `assert(condition, nil)` (an explicit `nil` message, as opposed to an omitted one) fell through to the generic `Some(message)` arm and re-raised the raw `nil` instead of the same `\"<no error object>\"` conversion `error(nil)` already applied - fixed by adding a `Some(LuaValue::Nil)` arm to `NativeFunction::Assert` mirroring `Error`'s; and `os.exit(code)` discarded any output `print`/`io.write` had already buffered (`std::process::exit` bypasses the CLI's normal `take_output`-based flush paths) - fixed by flushing the buffered output straight to `std::io::stdout()` first. Separately, extending the `checksyntax`-style `near '<token>'`/`near <eof>` suffix to the parser's `expect`/`expect_ident` primitives (used for cases like `for >> do end`/`syntax error`) surfaced that those functions are shared by both Sol's own syntax and Lua-compatibility parsing, so the suffix had to be gated behind a new `Parser::lua_near_suffix` helper (a no-op under `sol_extensions`) to avoid breaking `frontend_conformance.rs`'s expectation that Sol's own annotation-syntax errors stay suffix-free; the lexer's own invalid-byte error gained the same suffix (decimal-escaped `<\\N>`, matching `txtToken`), and `natives_load.rs`'s `is_eof_table_diagnostic`/`lua_syntax_message` needed to strip the new suffix before their exact-string-match special-casing for `load()`'s end-of-input-inside-table-constructor rewrite. See `checksyntax_style_errors_report_the_lua_compatible_near_suffix` in `crates/sol/tests/lua55.rs`. With the near-suffix fix landed, the file's line-280-onward `for i=1,1000 do doit('a = '); doit('a = 4+nil') end` loop (immediately before the \"testing syntax limits\" section) exposed a genuine, unrelated `call_depth` accounting leak, found by isolating it in `crates/sol/scratch/` repros down to a minimal case: `pcall` catching a plain, directly-raised runtime error (e.g. `4 + nil`, no nested call involved) never released that erroring frame's own `call_depth`/`depth_charged` charge, because `dispatch.rs`'s `drive_result` pops the erroring frame off `self.frames` before its `Err(mut error) =>` arm runs and never re-pushes it (unlike the sibling `PushClosure`-overflow arm, which explicitly re-pushes for exactly this reason) - so `unwind_error_to_marker`'s `removed = self.frames.len() - marker_index` frame count never saw it, under-releasing `call_depth` by one unit per caught error. This leaked one budget unit per `doit('a = 4+nil')` call, cumulatively exhausting the default 1000-unit `max_call_depth` budget by the time the file's \"testing syntax limits\" section ran its first ordinary, shallow `testrep` call - a call that does no deep recursion at all, which is what made the earlier failure look unrelated to call depth. Fixed by releasing the erroring frame's own charge in that same `Err(mut error) =>` arm, gated by the same `self.frames.len() > base_depth` condition `finish_frame` already uses for a normal return (a bare base frame's charge belongs to `call`'s own bookkeeping, not `depth_charged`, so it must not be double-released here). See `pcall_catching_a_plain_runtime_error_does_not_leak_call_depth_budget` in `crates/sol/tests/lua55.rs`. With that fixed, the file's own `for i=1,1000 do ... end` loop and the \"testing syntax limits\" section's first several `testrep` calls (lines 804-808) now pass, and the file advances to line 799-801's `testrep(\"return \", \"(\", \"2\", \")\", 2)`-style helper's `load(gencode(500))` assertion: real Lua's parser enforces a recursion-depth limit on nested constructs (`LUAI_MAXCCALLS`, checked by `luaY_syntaxerror`'s `\"too many\"`/`\"C stack overflow\"`-style diagnostics wired through `enterlevel`/`leavelevel` in `lparser.c`) so that 500 levels of nested parentheses/local-variable lists fail to parse at all, but Sol's own parser has no equivalent nesting-depth check and instead accepts 500 levels outright at line 794's inner `load(gencode(100))` step already passing (untested at 500 until this line) - not yet investigated further; this is a new, distinct gap (a missing parser recursion-depth limit, not a runtime `call_depth` issue) and is the file's current stopping point. Refined and partially fixed: reading the pinned Lua 5.5.0 C source directly (`lparser.c`/`lcode.c`, via the `lua-src` crate's vendored copy) showed the first three `testrep` variants at this stopping point (lines 804-806, all `local` declaration-list forms) actually fail in real Lua for a narrower reason than `LUAI_MAXCCALLS` recursion depth: `MAXVARS` (200), a flat cap on a function's live local-variable count checked once per variable as it enters scope (`adjustlocalvars`'s `luaY_checklimit`), independent of any parser nesting. Implemented the equivalent in Sol's `.lua`-compatibility bytecode compiler - `FuncState::check_local_variable_limit`/`declare_local_checked` (`crate/sol/src/lua_bytecode/func_state.rs`), called from every site that pushes a new local onto a scope (`Stmt::Local`/`MultiLocal`/`NumericFor`/`GenericFor`/`LocalFunction` in `compile_stmt.rs`, plus parameter/vararg binding in `mod.rs`'s `compile_function`) - deliberately only the flat 200-variable count, not real Lua's separate `MAX_FSTACK` (255) \"too many registers\" register-pressure check or its C-stack parser-recursion-depth limit, both of which stay unimplemented as noted below. See `a_function_with_too_many_local_variables_fails_to_compile` in `crates/sol/tests/lua55.rs`. With that fixed, lines 804-806 now correctly fail to compile at `gencode(500)`, and the bisection's actual remaining stopping point is line 807 (`testrep(\"local a; a\", \",a\", \"= 1\", \",1\")`, \"multiple assignment\" - a plain assignment to 500 repeated `a` targets, not a local declaration, so untouched by the `MAXVARS` fix). Verified against the pinned oracle (`/tmp` probes, not committed) that this case, and the remaining `testrep` variants after it (constructors, parentheses, nested calls, `do`/`while`/`if` blocks, function declarations, string concatenation, exponentiation - lines 807-816), all genuinely do fall under real Lua's `LUAI_MAXCCALLS`-style C-stack recursion-depth-during-parsing behavior as originally described above (each reports plain `\"C stack overflow\"` from the pinned oracle, not a `MAXVARS`/register-count message), so that attribution stands for everything past line 806 - only the specific local-declaration-count piece needed correcting/narrowing. Sol does not crash or hang on any of these inputs (confirmed via manual probes); it simply accepts them where real Lua would reject them, which is the remaining, still-deferred gap - a parser nesting-depth limit is architecturally harder to add correctly given Sol's AST-first (not recursive-descent-with-C-stack) parsing model and real Lua's own limit being platform/build-dependent in the first place, so it remains unimplemented rather than being approximated. Continuing the bisection past that cluster (neutralized only in `crate/sol/scratch/errors_bisect.lua`, never the real corpus file) reached line 819's `checkmessage(\"a = f(x\" .. string.rep(\",x\", 260) .. \")\", \"too many registers\")`: real Lua also caps a function's register-stack window at `MAX_FSTACK` (255, `lcode.c`'s `luaK_checkstack`), a distinct resource from `MAXVARS`, and Sol had no equivalent - `Reg` is a `u16` with far more headroom, so a call needing more than 255 live registers (261 call arguments, each needing its own register slot) compiled and ran instead of failing. Fixed narrowly: `FuncState` already tracked `max_reg` (the peak register-stack depth ever reserved via `alloc_reg`, incidentally already the exact equivalent of real Lua's own peak-usage `maxstacksize`), so `Compiler::compile_function` (`crate/sol/src/lua_bytecode/mod.rs`) now rejects a function whose final `max_reg` exceeds 255 with a \"too many registers\" message, checked once per function after its body finishes compiling rather than incrementally per-allocation like real Lua's `luaK_checkstack` (equivalent end effect for a `load()`-time compile failure, and far less invasive than threading a `Result` through `alloc_reg`'s ~50 call sites across `compile_expr.rs`/`compile_stmt.rs`/`compile_calls.rs`). See `a_function_using_too_many_registers_fails_to_compile` in `crates/sol/tests/lua55.rs`. With that fixed, the bisection advanced to line 858's upvalue-count stress test (`local function fooA() local a1..a127,b,c; local function fooB() local b1..b127,b; function fooC() return b+c+a1+b1+...+a127+b127 end end end`, expecting `\"too many upvalues\"`): real Lua also caps a function's upvalue count at `MAXUPVAL` (255, `lparser.c`'s `newupvalue`), which Sol has no equivalent of - `FuncState::add_upval` (called only from `Compiler::resolve` in `mod.rs`) is infallible. Not fixed: unlike the `MAXVARS`/`MAX_FSTACK` fixes, threading a `Result` through `add_upval`/`resolve` is a much larger lift, since `resolve(level, \"_ENV\")` is also called from `emit_environment_get`/`emit_environment_set` (`compile_calls.rs`), which are `()`-returning and invoked by *every* plain global variable read/write in the compiler, not just this narrow case. Separately, even a bare `MAXUPVAL` check wouldn't reproduce this exact corpus assertion as-written: real Lua's code generator frees/reuses a temporary register as soon as a binary operation folds it into its accumulator (`lcode.c`'s `freeexp`), so a long `a1+b1+a2+b2+...` addition chain only ever needs a couple of live registers at a time, but Sol's expression compiler was found (via this exact case) to allocate a fresh register per intermediate result without freeing the previous one - so with the `MAX_FSTACK` fix now in place, Sol actually hits its own 255-register cap first on this stress shape and reports \"too many registers\" instead of real Lua's \"too many upvalues\". That register-reuse gap (temporary-register liveness/reuse in `compile_expr.rs`'s binary-operator codegen) is a separate, likely-valuable-for-other-reasons architectural item, also not attempted here. Fixed in a later pass: added `FuncState::free_reg(reg, floor)` (`crate/sol/src/lua_bytecode/func_state.rs`) - reclaims `reg` back into `next_reg` only if it's at or above `floor` (the `next_reg` snapshot taken before the operand that produced it was compiled, so an active local's or an outer expression's own register, always below that snapshot, is never touched) and is the topmost currently-allocated register, mirroring real Lua's `freeexp`/`freereg` (`lcode.c`)'s own `lua_assert(reg == fs->freereg)` LIFO invariant. Wired into `compile_expr.rs`'s binary (including `and`/`or`), unary, `#`, indexing, and field-access cases: each frees its operand register(s), right-to-left, right before allocating its result register, so a long chain reuses a small constant number of registers instead of growing `max_reg` linearly with chain length. See `a_long_left_associative_expression_chain_reuses_registers_instead_of_growing_without_bound` in `crates/sol/tests/lua55.rs` (a 399-term addition chain, well within anything real Lua would reject, that used to trip Sol's own `MAX_FSTACK` cap and now compiles and evaluates correctly). This fix does not change `errors.lua`'s own upvalue stress test outcome, though, and re-investigating it after this fix uncovered a *different*, previously-masked root cause: with the addition-chain register growth gone, that stress test's inner `fooC` closure no longer trips `MAX_FSTACK` itself, but its enclosing `fooB` now does, at a much lower name count (127 locals) than either `MAXVARS` (200) or `MAX_FSTACK` (255) should allow for a function declaring that few locals. Root cause (separate from anything above, not fixed): `Stmt::MultiLocal`'s compilation (`compile_stmt.rs`) allocates *two* registers per declared local instead of one - `compile_expr_list` first computes each initializer (or, with no initializers at all, a nil pad) into its own freshly allocated register, and then the `MultiLocal` loop allocates a *second*, distinct register per name for `Instr::NewLocal`'s destination, permanently doubling a function's register cost per plain `local` declaration relative to real Lua's single-register-per-local `lparser.c`/`luaK_exp2nextreg` scheme. Confirmed via a minimal isolated repro (a single function declaring ~127 plain locals with no initializers at all, no nested closures or upvalues involved) that this alone crosses `MAX_FSTACK`, and confirmed it predates this session's register-reuse fix entirely (reproduces identically on the pre-fix tree; it was only ever masked by the fact that, before the `MAX_FSTACK` check existed at all, an oversized register file silently worked instead of being caught). This isn't a simple two-line fix, though: `NewLocal`'s separate destination register isn't gratuitous for every case - `regs[index]` can be a *pre-existing* variable's own register rather than a fresh temporary (e.g. `local a, b = someOuterA, someOuterA + 1`, where a bare-name initializer's `compile_expr` returns that outer variable's own register directly, per `ExprKind::Name`'s no-alloc fast path), and evaluating a later initializer directly into an earlier new local's future register before all initializers are read would risk exactly the aliasing corruption `crate/sol/src/lua_bytecode/func_state.rs`'s `retired_floor`/`MultiAssign`'s own snapshot-into-fresh-registers comment already document for the analogous assignment case. A correct fix needs to distinguish a genuinely fresh initializer temporary (safe to fold into the local's own destination register, the common case and real Lua's own default) from one that aliases a live outer register (must stay separate) before it can safely elide the second register - deferred as its own, separately-scoped item rather than risked here. The register-reuse fix itself also surfaced (and required fixing) a real naming regression: once a binary/field/index operation's operand registers are freed and reallocated, its result register can numerically coincide with its own operand register (e.g. `a._ENV.x` now compiles to `GetField(r0, r0, \"_ENV\"); GetField(r0, r0, \"x\")`, both self-overwriting `r0` - confirmed via `luac5.5 -l` to be exactly real Lua's own `GETFIELD` codegen shape for this expression, not a Sol-only artifact). `describe_register`'s existing \"chase through a self-overwriting field chain back to its root\" special case (`crate/sol/src/lua_runtime/dispatch.rs`, added for `compile_name_into`'s dotted-call-name lowering, e.g. `foo.bar.baz(...)`) could not distinguish that shape from an ordinary nested field-access chain hitting the same bytecode pattern, and started misreporting `a._ENV.x + 1`'s nil-field error as `\"global 'a'\"` instead of `\"field 'x'\"`. Confirmed against the pinned `lua5.5` oracle across several shapes (`aaa.bbb:ddd()`, `aaa.bbb.ccc:ddd()`, `foo.bar.baz()`, `foo.bar.baz.qux()`) that real Lua's own `getobjname` never chases through a `GETFIELD` to name some earlier receiver - it always names the most recently written field, so the chase-to-root special case was based on a mistaken premise even before this fix (it happened to go untriggered for the one pre-existing test that exercises this wording, `dotted_root.bad_field:bad_method()`, because that test's failure is a direct index-of-nil at the very first `GetField`, requiring no chase either way). Fixed by removing the chase-to-root branch entirely, keeping only the legitimate, unrelated `_ENV`-rebinding recursion (a lexically rebound `_ENV.name` field load must still report as `\"global 'name'\"`, matching real Lua). See `a_binary_operations_error_names_its_last_field_not_its_reused_register_root` in `crates/sol/tests/lua55.rs`. Continuing past that (neutralized in the scratch file only) reached the file's final stress case (line 891, 201 locals declared in a function body with a deliberately *missing* closing `end`, expecting `\"too many local variables\"` at `\"line 2\"` - the function's own declaration line): this surfaces a fourth, more fundamental gap rather than a fixable bug - real Lua's single-pass parser reports `MAXVARS` violations mid-parse, before it ever looks for a matching `end`, but Sol's `.lua` front end must fully parse a function into a complete, syntactically-valid AST (`end` included) *before* the later, separate compilation pass (where the `MAXVARS` fix lives, in `lua_bytecode`) ever runs - so an incomplete function body always surfaces its own \"unexpected end of input\" syntax error first, regardless of any resource-limit violation earlier inside it. This is a general consequence of Sol's two-phase parse-then-compile pipeline versus real Lua's single-pass parse-and-codegen (the same underlying reason the parser recursion-depth limit above is awkward to add), not specific to `MAXVARS`, and is not attempted here; the `MAXVARS` fix itself is unaffected for every syntactically-complete input. With all four of these items neutralized (only in the scratch bisection copy, each with its own explanatory comment - the real corpus file and this note's findings are unaffected by that scratch-only workaround), `errors.lua` now runs to completion end-to-end and prints `OK`, matching the pinned oracle's own final line - `status` stays `pending` rather than `pass` since the real, un-neutralized corpus file still fails at the multiple-assignment `testrep` case (line 807) documented above, one of the four still-deferred gaps."

