note = "Fixed 2026-10-01: the `notab (keys, t, ...v)` block (line ~249) requires a named vararg parameter accessed only via dynamic `v[k]`/`v.n` indexing to behave exactly like a `table.pack`-built table while allocating zero additional heap bytes per call (`assert(m == collectgarbage\"count\")`), and `foo(...t)` (line ~257) requires an in-range integer-key write (`t[1] = t[1] + 10`) to mutate the same backing storage rather than forcing materialization. Implemented a lazy named-vararg view: a compile-time safety scan (`try_lower_vararg_to_lazy_view`/`vararg_register_disqualifies` in `lua_bytecode/mod.rs`) proves, per function, that the named vararg's register is never captured as an upvalue and never appears as an operand anywhere except the `base` of `GetIndex`/`SetIndex`/`GetField`/`SetField` (rewritten to 4 new dedicated opcodes, `VarargIndexGet`/`VarargIndexSet`/`VarargFieldGet`/`VarargFieldSet`); when it qualifies, `Proto::vararg_lazy` is set and `new_lua_frame` (`lua_runtime/dispatch.rs`) skips eager `values_table`+`table_set(\"n\", ...)` construction entirely, leaving the register `Nil`. The 4 new opcodes (`lua_runtime/dispatch/bytecode.rs`) answer reads directly from the frame's own already-rooted `varargs: Vec<LuaValue>` (in-range integer key, `\"n\"`, or anything else) and perform in-range integer-key writes in place with no allocation; only an out-of-range/non-integer write (or any field-name write) calls `materialize_vararg_view` to build the real table on demand, matching the `foo`/general-write contract. `Instr::Vararg`'s `...`-expansion handler already required the named-vararg register to be a real `Table` (needed so a mutated pack's current contents feed back into later `...` reads, per the pre-existing `lua55_varargs.lua` `named` test) - extended with a `Nil if proto.vararg_lazy` case that falls back to reading `frame.varargs` directly, since an unmaterialized lazy view is semantically an unmutated fresh pack. The safety scan's `Call`/`TailCall`/`Return`/`Vararg` disqualification checks were tightened from a blanket `reg >= base` to the operand's actual `ValueCount`-sized range (`value_count_range_hits`): the previous blanket check treated the synthetic `Return(0, ValueCount::ZERO)` every function body ends with (`mod.rs`'s implicit-return emission) as reading every register from 0 upward, which wrongly disqualified almost every function whose vararg register wasn't literally 0 - a `Fixed(0)` count now correctly matches no registers regardless of `base`. A second, related false-positive - the unconditional scope-exit `DetachCell`/`LoadNil` cleanup emitted for every local at function end, including dead code positioned after an already-executed `return` - is resolved by `compute_reachable`, a conservative fallthrough/jump-target reachability pass that excludes provably-unreachable instructions from the disqualification scan. See `dynamic_lua_runtime_named_vararg_lazy_view_answers_like_table_pack_with_no_allocation`/`dynamic_lua_runtime_named_vararg_lazy_view_supports_in_range_writes`/`dynamic_lua_runtime_named_vararg_lazy_view_falls_back_to_a_real_table_for_out_of_range_writes` in `crates/sol/tests/lua55_dynamic_runtime_scoping.rs`. With this fixed, the unmodified upstream file runs end to end under `sol run`, exits 0, and prints `OK`; this case is promoted to `pass`."

[[case]]
