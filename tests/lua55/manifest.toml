[[case]]
path = "goto.lua"
category = "control-flow"
status = "pending"
requires = []
note = "blocked-on: goto/label duplicate-label and scope-violation validation (the previously-noted gap) is now implemented in `lua_bytecode.rs`'s dynamic-runtime compiler - `FuncState` tracks a live active-local count per scope (mirroring real Lua's `fs->nactvar`), clamps a bubbled-out pending goto's count to its closing scope's starting count (matching `movegotosout`), and compares goto/label counts in `check_goto_scope` to reject both duplicate labels and a `goto` that jumps into a local's scope, with the same `\"<goto NAME> at line L> jumps into the scope of 'V'\"` message real Lua uses. All cases through line 29 (duplicate labels, the flat and nested-block \"scope of 'aa'\" cases, and the repeat/until \"scope of 'xuxu'\" case) now pass, as do every \"should not error\" idiom (goto-continue in while/numeric-for/generic-for/if bodies, multi-use labels, a goto jumping cleanly out of a loop to a label after it) - see `crates/sol/tests/lua55_dynamic_runtime.rs`'s new `dynamic_lua_runtime_rejects_a_duplicate_label_*`/`dynamic_lua_runtime_rejects_a_goto_that_jumps_into_the_scope_of_a_local`/`dynamic_lua_runtime_allows_a_goto_to_skip_a_blocks_own_locals_*` tests. The corpus file's next real blocker is now line 30: `errmsg([[ goto l2; global *; ::l1:: ::l2:: print(3) ]], \"scope of '*'\")` - Lua 5.5's `global *` declaration form (distinct from the already-supported `global <const> name = value`) is not implemented; Sol's parser currently accepts it without producing the scope-tracking local named `*` that this test expects a goto to illegally skip over. This is a separate, unimplemented Lua 5.5 language feature (the `global` statement's block-scoped effect on subsequently-undeclared identifiers), not a goto/label-checking gap."

[[case]]
path = "heavy.lua"
category = "stress"
status = "pending"
requires = []
note = "blocked-on: this test's toomanyidx() loop (`for i = 1, math.huge do a[i] = i end`, expecting an eventual catchable out-of-memory pcall error) used to false-pass in ~8ms because Sol's numeric for loop only supported integer control values and errored on the float `math.huge` limit before the loop body ever ran - fixed this session (ForPrep/ForLoop now run a float-mode loop when any control value is a float). With that fixed, the loop now runs for real and instead hits Sol's non-catchable instruction budget (`Lua instruction budget exhausted`, escapes the inner pcall), since Sol has no real allocation-tracked out-of-memory error a pcall can catch - that remains a Phase 4/GC-adjacent gap."

