s change. With it, `checkerr(\"^%?:%?:\", f, {})` (line 309) and its line-316 sibling both pass, and the file now advances to line 331's `checkmessage(s..\"; local t = {}; t:bbb()\", \"field 'bbb'\")`: after the RK-limit-forcing prefix of 1000 assignments, real Lua's `getobjname` degrades a method-call name resolution to a generic field name, but Sol's still reports it as a method (`attempt to call a nil value (method 'bbb')` instead of expected `...(field 'bbb')`) - a narrow, specific gap in the same call-site name-resolution machinery already deferred for `db.lua`'s `funcnamefromcode` gap (see that file's own note), not attempted here. Working around only that one line (in `crates/sol/scratch/errors_bisect.lua`, never the real corpus file), the file advances to line 369's `checkmessage(\"getmetatable(io.stdin).__gc()\", \"no value\")`: Sol's `io.stdin` metatable had no `__gc`/`__close` entry at all, so this failed with the unrelated \"attempt to call a nil value (field '__gc')\" instead. Fixed: real Lua's `liolib.c` installs the same `f_gc` C function under both `__gc` and `__close` on the file-handle metatable (`metameth[]`) - an ordinary, directly Lua-callable function that argument-checks its receiver (`tolstream`'s `luaL_checkudata`) like any other file method, not something only the collector/a `<close>` scope exit can invoke. Added `NativeFunction::FileGc` (`value.rs`/`natives.rs`/`natives_os_io.rs`) implementing that check (no-op on a valid `FILE*`, matching real Lua's own no-op for the standard streams, whose `closef` is unset), and installed it under both keys on `io.stdin`'s canonical metatable in `init.rs` - reusing one allocated `heap.alloc_native_callable` object for both keys, since Sol's `CFunction`/`NativeCallable` equality is object-identity-based (`value.rs`) and real Lua's `mt.__gc == mt.__close` (same underlying C function pointer pushed twice). Calling it required a small dispatch bridge: `CanonicalAdapter::import_native_function` allocates provider-0 native callables (`canonical.rs`), but `canonical_to_lua` reads any canonical `NativeCallable` back as a `LuaValue::CFunction`, and `call_c_function_outcome`'s `c_functions` registry is populated only for embedder-registered (provider 1/2) callables - so a provider-0 callable had no dispatch path at all. Added a narrowly-scoped special case in `call_c_function_outcome` (`dispatch.rs`) recognizing `provider == 0 && function == NativeFunction::FileGc as u32` and routing directly to `call_native`, rather than a general provider-0-to-`NativeFunction` reverse-conversion mechanism (`NativeFunction` has no `from_u32`/`TryFrom` impl). See `file_handle_metatable_exposes_a_callable_gc_and_close_with_a_filestar_argument_check` in `crates/sol/tests/lua55.rs`. With that fixed, the file advances to line 381's `checkmessage(\"aaa:sub()\", \"bad self\")` (and its line 382-383 siblings `string.sub('a', {})`/`('a'):sub{}`): real Lua's `luaL_argerror` (`lauxlib.c`) treats a method call specially - argument numbers exclude the implicit `self` (`arg--`), and if the decremented number reaches 0 (the self argument itself failed) the message becomes `\"calling 'NAME' on bad self (EXTRAMSG)\"` instead of `\"bad argument #N to 'NAME'\"`; Sol had neither the renumbering nor the rewording, and separately `string.sub`'s own argument checks used the generic, contextless `self.string()`/`self.integer()` coercion helpers, which produce a bare \"string expected\"/\"number expected\" with no `\"bad argument #N to 'NAME'\"` wrapping at all. Fixed in two parts: (1) added `checked_string`/`checked_integer` (`natives.rs`), thin wrappers around `string`/`integer` that format real Lua's `\"bad argument #N to 'FUNCTION' (TYPE expected, got TYPE2)\"` shape (preserving `coerce_integer`'s distinct \"number has no integer representation\" wording for a non-integral float rather than overwriting it), and switched `NativeFunction::StringSub` to use them; (2) added `annotate_bad_argument_error` (`dispatch.rs`), a post-hoc rewrite mirroring the existing `annotate_call_error`/`annotate_index_error` pattern - reusing `describe_register`'s bytecode-level call-site resolution at the same leaf-call error site, it detects when the failing call was a method call and, for any native function's already-`\"bad argument #N to 'NAME'\"`-shaped error (not just `string.sub`'s), decrements `N` by one and rewords to \"calling on bad self\" when `N` reaches 0 - a small, generically reusable mechanism, not a per-function special case. Verified against the pinned oracle for all three call shapes (`aaa:sub()` -> \"calling 'sub' on bad self (string expected, got table)\"; `string.sub('a', {})` -> \"bad argument #2 to 'sub'\"; `('a'):sub{}` -> \"bad argument #1 to 'sub'\", the start-argument renumbered down by one for the method-call form). See `bad_argument_errors_on_a_method_calls_self_argument_use_reals_calling_on_bad_self_wording` in `crates/sol/tests/lua55.rs`. Past that, the file surfaces three further, distinct, and disproportionately-scoped gaps, none attempted here: (a) line 385-386's `checkmessage(\"table.sort({1,2,3}, table.sort)\", \"'table.sort'\")`/`checkmessage(\"string.gsub('s', 's', setmetatable)\", \"'setmetatable'\")` name a native callback invoked with no Lua bytecode call site at all (`table.sort`'s comparator, `gsub`'s replacement function, both called directly from Rust-native code) - real Lua names these via `luaL_argerror`'s `pushglobalfuncname` fallback, a reverse lookup through `package.loaded`'s library tables for a value-identity match, synthesizing a qualified `\"table.sort\"`/unqualified `\"setmetatable\"` name; Sol's native call-site naming is entirely bytecode-driven (`describe_register`) and has no equivalent for a native-to-native invocation - and separately, many native argument-checks besides `string.sub` (e.g. `expect_table`, used by `table.sort`/`table.insert`/`table.move`/etc.) still produce a bare, unwrapped message even for an ordinary top-level 