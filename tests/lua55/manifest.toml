note = "The prior blocker (this test's `toomanyidx()` loop hitting Sol's non-catchable instruction-budget exhaustion instead of a real, pcall-catchable out-of-memory error) is now fixed: `LuaTable`'s array/hash growth is charged against the allocation budget at every genuinely-new-key write (`gc.rs`'s new `charge_new_table_entry`, called from `dispatch.rs`'s `set_index_resolve`/`raw_set_index` and `dispatch/bytecode.rs`'s `SetArrayMulti` handler whenever the pre-existing raw value at that key was `Nil`), with a `LuaTable::charged_bytes` field so `collect_cycles` credits the exact charged amount back on reclaim (avoiding regressions in small-budget GC tests that churn table fields across repeated `collectgarbage()` calls). An unbounded `a[i] = i` growth loop now raises a real `LuaError` (\"Lua allocation budget exhausted\") that a `pcall` catches normally, and execution continues correctly afterward - previously impossible, since instruction-budget exhaustion cascaded and poisoned all subsequent execution even past a successful `pcall`. With that fixed, the real unmodified upstream file (verified via `lua-5.5.1-tests.tar.gz`'s pinned corpus, not a synthetic reproduction) now runs `toomanyidx()` to completion and reaches `print \"OK\"` under an elevated `SOL_LUA_ALLOCATION_BUDGET`/`SOL_LUA_INSTRUCTION_BUDGET`, matching the pinned `/opt/homebrew/bin/lua5.5` oracle's own structural behavior (also raises a catchable error inside the same pcall, from its own `table overflow`, and reaches `OK`). `status = \"diverges\"` rather than `pass`: the exact error text (\"Lua allocation budget exhausted\" vs. real Lua's \"table overflow\") and the printed memory-usage numbers differ, since Sol's allocation-budget accounting and real Lua's `lua_gc`-reported memory are different, non-byte-comparable models - the same category of expected, unavoidable divergence already documented for `sort.lua`'s non-deterministic timing output. (Separately, `io.stderr` was entirely missing - fixed by