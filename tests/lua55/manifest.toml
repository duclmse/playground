[[case]]
path = "db.lua"
category = "debug-library"
status = "pending"
requires = ["debug-library"]
note = "Two successive blockers are now fixed. `debug.sethook`/`debug.gethook` (previously entirely missing) install/query/clear a per-coroutine hook via the dispatch loop's call/return/line/count hook events (`fire_hook`, `HookState`, `active_hook`/`running_hook` on `LuaRuntime`, `hook_last_pc`/`hook_last_line` per-frame tracking in `dispatch.rs`) - `assert(not debug.gethook())` and the central `test()` helper's `\"l\"`-mode line-tracing assertions (line 19 onward) pass. Past that, the file surfaced a distinct `debug.getinfo` completeness gap unrelated to hooks (line 39's `debug.getinfo(test, \"SfL\")`): `func` is now set to the exact closure value for the direct-function-value lookup case (`natives_debug.rs`'s `LuaValue::Closure` arm), `describe_lua_proto` now builds `activelines` as a line-to-`true` set from `proto.source_map`, and `LuaRuntime::set_chunk_name` (wired from all three `sol run` call sites in `main.rs`) registers a `chunk_sources` entry for the CLI's own top-level compile the same way `load` already does for a `load`ed chunk, so `debug.getinfo(1).source`/`.short_src` are no longer `nil` for the running main chunk either. Running against the pinned oracle past this fix surfaced two further, distinct compiler line-info gaps, both now fixed: (1) `lastlinedefined` was approximated as the maximum line number appearing anywhere in `proto.source_map`, not the actual line of the function's closing `end` token; fixed by adding `ast::Function::end_line` (populated at all 3 parser construction sites from the already-computed closing-token span) and a parallel `Proto::last_line_defined`, with `describe_lua_proto` now reporting it directly instead of scanning for a max. (2) `activelines[linedefined]` (the declaration line) was incorrectly `true` because the implicit `return` synthesized at the end of every function body, and the `CloseSlots` instruction emitted when popping the function's outermost scope, were both attributed to `function.line` (the declaration line) instead of `function.end_line` (the closing `end`'s line, matching real Lua's `luaK_ret`/`close_func` in `lparser.c`) - fixed in `Compiler::compile_function` (`crate/sol/src/lua_bytecode/mod.rs`). With both fixed, line 41-48's full `linedefined`/`lastlinedefined`/`activelines` boundary assertions now pass exactly against the oracle. Past that, line 57's `assert(#actl == 0)` required `string.dump(f, true)`'s strip flag to actually omit debug info from the dumped/reloaded closure; `Proto` is now `Clone` and `string.dump` honors `strip` by registering a proto clone with an empty `source_map` under its own dump-registry key (distinct from the original, still-running closure's full-debug-info proto) instead of always dumping the original - `linedefined`/`lastlinedefined` are left untouched by stripping, matching real Lua's `ldump.c` (they are not considered debug info). With that fixed too, the file now progresses through file/string chunkname truncation (lines 61-85) all the way to line 91's `assert(a.name == 'f' and a.namewhat == 'local')` on a level-based `debug.getinfo(2)` lookup - this needs real call-site name/namewhat resolution (real Lua's `funcnamefromcode` in `ldebug.c`, which walks the *caller's* bytecode at the call instruction to determine how the callee was referenced: global/local/upvalue/field/method). `natives_debug.rs` already documents this as a known, deliberate gap (only a callee's own declared-local-function name is resolved today; every other call form falls back to Lua's own nil/empty convention) - a substantially larger feature than the line-info fixes in this pass, so `db.lua` stays `pending` on it rather than being promoted."

[[case]]
path = "errors.lua"
category = "errors"
status = "pending"
requires = []
note = "the `local debug = require\"debug\"` at line 6 is no longer a blocker (debug is preloaded). Fixed two genuine bugs found while chasing this file: `error()`/`error(nil)` now default the message to nil and surface it as the string \"<no error object>\" from pcall/xpcall, matching real Lua's luaG_errormsg (dynamic_lua_runtime_error_with_no_message_or_a_nil_message_becomes_no_error_object); and `return` is now rejected unless it is the last statement in its block, matching Lua's retstat grammar (dynamic_lua_runtime_return_must_be_the_last_statement_in_a_block). The file now reaches line 65's `checksyntax` call before stopping on the same pre-existing, out-of-scope `line N:` vs `chunkname:N:` diagnostic-prefix divergence already documented for goto.lua/constructs.lua."

[[case]]
path = "events.lua"
category = "metatables"
status = "diverges"
requires = []
note = "The prior note's claim that `local debug = require'debug'` at line 6 is blocked was stale/wrong - `debug` is preloaded (`init.rs`) and `debug.setmetatable`/`debug.getmetatable` are implemented. Past that, four genuine bugs surfaced and are now fixed: (1) `getmetatable`/`setmetatable` did not honor a metatable's `__metatable` protection field at all (line 26's `assert(getmetatable(a) == \"xuxu\")` and the following protected-metatable `pcall` case). (2) a parser-level bug in the top-level `function NAME(...) end` hoisting-eligibility heuristic (`parser.rs`'s `function_references_any_name`/the `functions` vs. in-order `chunk` split) could invert the execution order of two same-named top-level redeclarations whenever the earlier one was forced in-order (e.g. its own parameter name happened to collide with an outer chunk-local, or it legitimately referenced one) while the later one had no such reason and got hoisted - hoisted `functions` entries always bind before `chunk` runs, so the later (intended-final) definition would silently lose to the earlier one; fixed by tracking every plain top-level function name once forced in-order (`chunk_function_names`) and forcing every later same-named declaration in-order too, preserving real Lua's strict textual redefinition order (this affects any `.lua` file that redefines a same-named top-level function, not just this one). (3) the `__unm`/`__bnot`/`__len` unary metamethods were called with the operand passed only once instead of duplicated as both arguments, unlike real Lua's `luaT_callTMres(L, tm, p1, p1, res)` - broke `checkcap`'s captured-varargs-length assertions for `-a`, `~a`, `#a` (lines 175/180/181). (4) `getmetatable`/`debug.getmetatable`/`debug.setmetatable` only recognized `number_metatable` for the shared per-basic-type metatable, not booleans or nil - added `boolean_metatable`/`nil_metatable` alongside it so `debug.setmetatable(true, mt)`/`debug.setmetatable(nil, mt)` and the following `__index`/`__add` dispatch through them work (lines 481-496). With all four fixed, the file runs to completion (prints `OK`, `return 12`) except one remaining assertion: line 196's `assert(not pcall(rawlen, io.stdin))` expects `rawlen` to reject a file handle as neither table nor string, but Sol's `io.stdin`/file handles are implemented as plain Lua tables (type `\"table\"`), not a distinct userdata representation, so `rawlen` succeeds on it instead of erroring - a real, separate architectural gap (io library handles need their own opaque/userdata-like value representation) rather than anything fixable in this file's own logic; `status = \"diverges\"` rather than `pass` for exactly that one assertion."

