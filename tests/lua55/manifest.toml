note = "`local debug = require \"debug\"` at line 8 is no longer a blocker (debug is preloaded); the inline `require\"debug\".getinfo`/`debug.getinfo` calls at lines 38/249 now work too via a new minimal debug.getinfo(level).currentline (dynamic_lua_runtime_debug_getinfo_reports_the_calling_frames_current_line). Also fixed two byte-oriented lexer bugs found while chasing this file: a literal vertical tab (0x0B) was not recognized as whitespace between tokens or while a `\\z` string escape skips whitespace, because Rust's `is_ascii_whitespace` deliberately excludes it unlike Lua's own `lisspace` (dynamic_lua_runtime_vertical_tab_and_form_feed_count_as_whitespace_including_inside_a_z_escape). The lexer's `near '<token>'`/`near <eof>` diagnostic suffix (`lexerror`/`txtToken`, `llex.c`) is now implemented too (`Scanner::error_near` in lexer.rs, covering every escape/digit-validation failure and unfinished-string/long-string case in `quoted`/`long_string`; regression coverage in `lexer_errors_report_lua_compatible_near_text`, tests/lua55.rs) - the file's ~30 `lexerror` calls (lines 78-122) all now pass, past the former line-85 stopping point. The former line-127 'valid characters in variable names' stopping point (byte 35, `#`) is fixed too: real Lua only skips a leading `#` shebang line inside `lauxlib.c`'s `luaL_loadfilex` (a file-loading helper), never inside the lexer (`llex.c`) or `lua_load`'s generic reader path used by `load()`, so Sol's lexer now takes a `skip_shebang: bool` (`Scanner::new`/`lex_bytes` vs. the new `lex_bytes_no_shebang`, threaded through `compile_chunk_named`) - `load()`'s call site passes `false` so `load(\"#=1\", \"\")` now correctly fails to compile (`#` parsed as the unary length operator, invalid at statement start) instead of silently succeeding as a no-op, while `dofile`/`require`'s Lua searcher still pass `true` and keep skipping a real shebang line (regression coverage: `load_does_not_skip_a_shebang_but_file_loading_still_does`, tests/lu