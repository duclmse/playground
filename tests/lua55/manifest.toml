note = "Corrected 2026-10-01: the 2026-09-27 note above misdiagnosed the remaining blocker. The canonical heap's short/long string split (`Heap::alloc_string` vs `alloc_string_fresh`, gated on `LUAI_MAXSHORTLEN` = 40 bytes) and the value-layer split that routes every runtime-computed string through it (`CanonicalString::intern` for compile-time constants vs `CanonicalString::fresh`/`LuaRuntime::fresh_str` for concatenation/string-library results/formatted output) already existed - both landed together in the 2026-09-25 U2 canonical-heap string migration, before the 2026-09-27 note was written, so `string.rep`'s result already used the non-interning `fresh_str` path the whole time. The actual bug was one line away: `LuaValue::identity_address`'s `String` arm (`lua_runtime/value.rs`) computed `value.object_id().raw() as usize | 1`, a `| 1` bit-mask carried over unmodified from an earlier content-hash-based `%p` scheme (where OR-ing in the low bit only threw away one bit of a wide, well-distributed hash) - once strings moved onto `ObjectId` (`slot + 1` in the low 32 bits, generation in the high 32), that same mask instead collapsed any two *adjacent* heap slots' reported addresses together, since `(slot+1) | 1 == (slot+2) | 1` whenever `slot+1` is even. Two long `string.rep(\"a\", 300)` calls right next to each other reliably land in adjacent slots and get genuinely distinct `ObjectId`s from `alloc_string_fresh`, but the mask made their `%p` output collide - matching the prior note's own observation that the two addresses sometimes differed (when enough intervening allocations separated their slots by more than one) and sometimes didn't (adjacent slots), which was heap-history-dependent slot-parity luck, not a representational gap. Every other `identity_address` arm already returns its bare `object_id().raw() as usize` (`Table`/`CanonicalTable`/`Closure`/`CFunction`/`GMatchIterator`/`Thread`/`Userdata`) with no such masking; removed the stray `| 1` from the `String` arm to match, verified deterministic across repeated runs (`dynamic_lua_runtime_two_separately_computed_long_strings_never_share_identity`, `crate/sol/tests/lua55_dynamic_runtime_string.rs`). The unmodified upstream file now runs end to end and prints `OK`; re-verified `pass` with zero crate-test regressions."

