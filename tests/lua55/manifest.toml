[[case]]
path = "goto.lua"
category = "control-flow"
status = "pending"
requires = []
note = "blocked-on: goto/label duplicate-label and scope-violation validation is implemented in `lua_bytecode.rs`'s dynamic-runtime compiler - `FuncState` tracks a live active-local count per scope (mirroring real Lua's `fs->nactvar`), clamps a bubbled-out pending goto's count to its closing scope's starting count (matching `movegotosout`), and compares goto/label counts in `check_goto_scope` to reject both duplicate labels and a `goto` that jumps into a local's scope, with the same `\"<goto NAME> at line L> jumps into the scope of 'V'\"` message real Lua uses. `global *`/`global none` declarations also now register as goto-scope pseudo-locals (`BlockScope.global_decls`, `FuncState::declare_global_pseudo`) so a goto skipping one is caught the same way, matching `errmsg([[ goto l2; global *; ::l1:: ::l2:: print(3) ]], \"scope of '*'\")` at line 30 - see `crates/sol/tests/lua55_dynamic_runtime.rs`'s `dynamic_lua_runtime_rejects_a_duplicate_label_*`/`dynamic_lua_runtime_rejects_a_goto_that_jumps_into_the_scope_of_a_local`/`dynamic_lua_runtime_rejects_a_goto_that_jumps_into_the_scope_of_a_global_star_declaration`/`dynamic_lua_runtime_allows_a_goto_to_skip_a_blocks_own_locals_*` tests. `debug.upvalueid` (the only `debug.*` call this file makes, used at lines 168-225 to assert upvalue-sharing topology across closures created inside a goto-driven loop) is now implemented too - a new `LuaValue::LightUserdata(usize)` variant wraps a closure's captured upvalue cell's `Rc::as_ptr` identity, `NativeFunction::DebugUpvalueid` extracts it from `LuaClosure.upvals`, and the `debug` table is installed like `os`/`io`/`coroutine` (always present as a global/preload entry, but the `upvalueid` call itself is gated on the existing `capabilities.debug` flag, previously unused) - see `dynamic_lua_runtime_implements_debug_upvalueid`/the `debug.upvalueid` line added to `dynamic_lua_runtime_gates_os_and_io_behind_explicit_capabilities`. Lua 5.5's fuller `global`-declaration strict-checking semantics (goto.lua lines ~296-474) are now implemented too: `global function NAME` declares (and activates) `NAME` as a global *before* compiling its body, matching real Lua's `globalfunc`, so the body's own recursive self-reference and any later use of the name resolve as the declared global rather than an outer local of the same name (previously `global function` never shadowed anything); and `global NAME = value`/`global function NAME` now run the runtime `\"global 'NAME' already defined\"` guard real Lua's `checkglobal`/`OP_ERRNNIL` requires whenever the target's current value is non-nil at the moment of declaration (a new `Instr::ErrorIfGlobalDefined`, checked via the same `_ENV`-aware read used for ordinary global access, so it also fires correctly through a rebound local `_ENV` table) - see `dynamic_lua_runtime_named_global_declaration_is_block_scoped_and_shadows_an_outer_local`/`dynamic_lua_runtime_declaring_env_as_a_named_global_poisons_all_global_access`/`dynamic_lua_runtime_env_is_exempt_from_the_strict_declared_check`/`dynamic_lua_runtime_global_function_declaration_shadows_an_outer_local_of_the_same_name`/`dynamic_lua_runtime_global_declaration_with_an_initializer_errors_if_already_defined`/`dynamic_lua_runtime_global_already_defined_check_also_applies_to_a_rebound_env_table`. `global none` rejecting an undeclared bareword global/function-statement target, globals rejecting `<close>`, and block-scoped declare-before-use enforcement were already covered by the existing goto-scope pseudo-local tracking. Running the unmodified upstream file now reaches line 329 (`assert(load(\"global = 1; return global\")() == 1)`) before stopping on a pre-existing, documented, intentionally out-of-scope divergence: Sol always reserves `global` as a hard keyword, while real Lua's non-instrumented build (without the `T`/ltests flag) treats it as a contextual/soft keyword usable as an ordinary identifier, so `load(\"global = 1; ...\")` fails to compile under Sol and calling its `nil` result raises \"attempt to call a nil value\" instead of running the assertion. Working around only that one line (verified in `crates/sol/scratch/goto_bisect.lua`, never the real corpus file) lets the file continue to a second, independent, likewise out-of-scope divergence at line 361 (`checkerr([[ ... ]], \"%:2%:\")`): the corpus expects real Lua's `chunkname:N:` error-message-prefix convention (so `%:2%:` literally matches `:2:`), but Sol's diagnostics use a `line N:` prefix instead - the underlying error content is otherwise correct (`attempt to assign to const variable 'foo'`), so this is a general, pre-existing Sol diagnostic-format difference unrelated to `global` semantics, not something this feature plans to change. With both divergences worked around only in `crates/sol/scratch/goto_bisect.lua` (never the real corpus file or this note's expectations), the file runs cleanly end-to-end and prints `OK`; this case stays `pending` because the unmodified upstream file does not yet exit 0 under `sol run`."

