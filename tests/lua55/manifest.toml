[[case]]
path = "constructs.lua"
category = "control-flow"
status = "pending"
requires = []
note = "The prior note claiming a line-6 `require \"debug\"` blocker is stale: `debug` has been a preloaded/preregistered module since goto.lua's `debug.upvalueid` work, so line 6 now succeeds. Running the unmodified upstream file today reaches `print'+'` (line 238) and then the `<const>`-attribute `checkload` block, fixing two genuine bugs found along the way: (1) `t[nil]`/other unhashable-key table reads (`assert(x[nil] == nil)`, line ~140 in the file's `and`/`or`/table section) incorrectly raised `\"table index is nil\"` - real Lua only raises that for a *write* (`luaH_newkey`), never a read (`LuaTable::get` in `lua_runtime/value.rs` wrongly reused the write-path key error); and (2) a parenthesized multi-value expression (`(f())`) failed to truncate to exactly one value like real Lua requires, instead still expanding all of `f`'s results - fixed via a new `ast::ExprKind::Paren` node the parser now wraps `Call`/`CallExpr`/`MethodCall`/`Vararg` in when parenthesized, which the dynamic bytecode compiler (`compile_expr.rs`) compiles as a single-value expression instead of a multi-value one. See `dynamic_lua_runtime_table_read_of_a_nil_or_unhashable_key_returns_nil_but_a_write_still_errors`/`dynamic_lua_runtime_parenthesized_call_truncates_to_one_value` in `crates/sol/tests/lua55_dynamic_runtime.rs`. With both fixed, the file now reaches line 244's `checkload([[local xxx <const> = 20; xxx = 10]], \":1: attempt to assign to const variable 'xxx'\")` before stopping on the same pre-existing, documented, intentionally out-of-scope divergence already noted on goto.lua: the corpus's `msg` patterns expect real Lua's `chunkname:N:` error-prefix convention (so `:1:` is a literal substring of the message), but Sol's diagnostics use a `line N:` prefix instead - the underlying error content is otherwise correct, so this is a general Sol diagnostic-format difference unrelated to this file's own semantics. This case stays `pending` because the unmodified upstream file does not yet exit 0 under `sol run`."

