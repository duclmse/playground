note = "blocked-on: math.random/math.randomseed's xoshiro256** behavior, the former line-335 blocker, the table-iteration stress section, native argument-count validation's \"bad argument\" wording (checkerror(\"bad argument\", pairs) at line 398), and `next`/`pairs` traversal after tombstoning a deleted key mid-iteration are all now fixed (the last was `LuaTable::hash`'s `std::HashMap` silently reordering its iteration order on a same-key overwrite when an internal capacity-growth rehash happened to trigger; fixed by switching to `indexmap::IndexMap`, which never repositions an existing key). The former line-581 blocker (`table.insert`/`table.remove` only ever splicing the array-part `Vec` directly, invisible to live integer keys - `0`, negatives, or anything past the array part's contiguous prefix - held in a table's hash part) and the former line-613 blocker (the whole table library, most notably `table.sort`'s coroutine-yield-safe stepped implementation, reading/writing a table argument's raw storage directly instead of respecting `__index`/`__newindex`/`__len` on a \"proxy\" table) are also now fixed, by rewriting `table.insert`/`remove`/`concat`/`unpack`/`sort` in terms of new metamethod-aware `LuaRuntime::index_get`/`index_set`/`length_of` helpers (blocking wrappers around the existing non-blocking `index_resolve`/`set_index_resolve`/`len_resolve` primitives), including matching real Lua's C-integer wraparound when a `__len` reports `math.maxinteger`. Those, in turn, uncovered two more in the same \"testing floats in numeric for\"/\"checking types\" region, both now fixed: a generic `for`'s loop variables were not registered as const locals (unlike a numeric `for`'s control variable), so assigning to one failed to raise \"assign to const variable\"; and the numeric `for` loop only ran an all-integer loop when *every* control value was already an integer, so a float limit alongside an integer init/step (e.g. `for i = 1, 10.9 do`) incorrectly promoted the whole loop - and its control variable - to floats instead of \"fixing\" the limit into a rounded/clamped integer (floor when ascending, ceil when descending, clamped to `i64::MAX`/`i64::MIN` when out of range) the way real Lua's `forlimit` does. The former line-919 blocker (`assert(closed)` inside the `__pairs`-with-to-be-closed-value block) is also now fixed: Lua 5.4+ `<close>`/to-be-closed-variable support has been implemented end to end - parser support for the `<close>` attribute (typed `.sol` rejects it with a dynamic-runtime-fallback error, since it's a dynamic-only feature), a `MarkClose`/`CloseSlots` bytecode pair emitted at every scope-exit path (fallthrough, `break`, `return`) that closes locals in LIFO declaration order, `__close` metamethod dispatch (including passing through the in-flight error on an error-driven unwind, across `pcall`/`xpcall`, `coroutine.resume`, and blocking native-call boundaries alike), and a generic `for`'s implicit closing of a 4th iterator-list value scoped to the whole loop. (`goto` jumping out of a `<close>` variable's scope is a deliberate, documented, out-of-scope limitation - see the code comment at the `Stmt::Goto` compilation site in `lua_bytecode.rs`.) That, in turn, reached the previously-unreached \"testing ipairs with metamethods\" section (line ~924) and surfaced one more real bug, now also fixed: `ipairs`'s iterator read table slots with raw access instead of respecting `__index` (Lua's `ipairs` has used ordinary, metamethod-respecting indexing since 5.3), so a proxy table's `__index` was silently ignored; fixed by routing it through the same metamethod-aware `LuaRuntime::index_get` helper. With all of the above fixed, the case now runs to completion and prints `OK` under elevated `SOL_LUA_INSTRUCTION_BUDGET`/`SOL_LUA_CALL_DEPTH_BUDGET`/`SOL_LUA_ALLOCATION_BUDGET` overrides (the same env vars documented in `docs/features/lua-compatibility.md`'s benchmark addendum) - but `sol run`'s default embedder-sized instruction budget (1,000,000, sized for untrusted code) is exhausted mid-file in the \"testing attack on table length\" hash-collision stress section, an orthogonal, pre-existing budget-sizing gap rather than a compatibility bug, so this case cannot be reclassified from `pending` to `pass` (which the corpus runner exercises under default budgets) without first addressing that. The upstream file's `T`-gated (ltests) sections are already skipped gracefully by upstream code when `T` is absent, so that is not an independent blocker on its own."

