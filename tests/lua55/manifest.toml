[[case]]
path = "locals.lua"
category = "scope-and-attributes"
status = "pending"
requires = ["debug-library", "native-modules", "tracegc-module"]
note = "blocked-on: `local debug = require\"debug\"` at line 8, immediately followed by `local tracegc = require\"tracegc\"` at line 10; require is sandboxed to explicitly pre-registered in-memory modules, Sol has no debug library implementation to register (same pre-existing gap as cstack.lua/coroutine.lua/main.lua), and `tracegc` is the suite's native C test module (same host requirement as tracegc.lua). (The prior note claiming a line-250 `<close>` blocker was stale/incorrect: line 8 is reached first. `<close>`/to-be-closed-variable support is implemented now regardless - see nextvar.lua's note - so once both dependencies exist this case may hit a different, later blocker.)"

