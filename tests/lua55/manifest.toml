requires = []
note = "blocked-on: math.random/math.randomseed's xoshiro256** behavior, the former line-335 blocker, the table-iteration stress section, native argument-count validation's \"bad argument\" wording (checkerror(\"bad argument\", pairs) at line 398), and `next`/`pairs` traversal after tombstoning a deleted key mid-iteration are all now fixed (the last was `LuaTable::hash`'s `std::HashMap` silently reordering its iteration order on a same-key overwrite when an internal capacity-growth rehash happened to trigger; fixed by switching to `indexmap::IndexMap`, which never repositions an existing key). The former line-581 blocker (`table.insert`/`table.remove` only ever splicing the array-part `Vec` directly, invisible to live integer keys - `0`, negatives, or anything past the array part's contiguous prefix - held in a table's hash part) and the former line-613 blocker (the whole table library, most notably `table.sort`'s coroutine-yield-safe stepped implementation, reading/writing a table argument's raw storage directly instead of respecting `__index`/`__newindex`/`__len` on a \"proxy\" table) are also now fixed, by rewriting `table.insert`/`remove`/`concat`/`unpack`/`sort` in terms of new metamethod-aware `LuaRuntime::index_get`/`index_set`/`length_of` helpers (blocking wrappers around the existing non-blocking `index_resolve`/`set_index_resolve`/`len_resolve` primitives), including matching real Lua's C-integer wraparound when a `__len` reports `math.maxinteger`. Those, in turn, uncovered two more in the same \"testing floats in numeric for\"/\"checking types\" region, both now fixed: a generic `for`'s loop variables were not registered as const locals (unlike a numeric `for`'s control variable), so assigning to one failed to raise \"assign to const variable\"; and the numeric `for` loop only ran an all-integer loop when *every* control value was already an integer, so a float limit alongside an integer init/step (e.g. `for i = 1, 10.9 do`) incorrectly promoted the whole