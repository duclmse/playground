note = "The prior note's claim that `local debug = require'debug'` at line 6 is blocked was stale/wrong - `debug` is preloaded (`init.rs`) and `debug.setmetatable`/`debug.getmetatable` are implemented. Past that, four genuine bugs surfaced and are now fixed: (1) `getmetatable`/`setmetatable` did not honor a metatable's `__metatable` protection field at all (line 26's `assert(getmetatable(a) == \"xuxu\")` and the following protected-metatable `pcall` case). (2) a parser-level bug in the top-level `function NAME(...) end` hoisting-eligibility heuristic (`parser.rs`'s `function_references_any_name`/the `functions` vs. in-order `chunk` split) could invert the execution order of two same-named top-level redeclarations whenever the earlier one was forced in-order (e.g. its own parameter name happened to collide with an outer chunk-local, or it legitimately referenced one) while the later one had no such reason and got hoisted - hoisted `functions` entries always bind before `chunk` runs, so the later (intended-final) definition would silently lose to the earlier one; fixed by tracking every plain top-level function name once forced in-order (`chunk_function_names`) and forcing every later same-named declaration in-order too, preserving real Lua's strict textual redefinition order (this affects any `.lua` file that redefines a same-named top-level function, not just this one). (3) the `__unm`/`__bnot`/`__len` unary metamethods were called with the operand passed only once instead of duplicated as both arguments, unlike real Lua's `luaT_callTMres(L, tm, p1, p1, res)` - broke `checkcap`'s captured-varargs-length assertions for `-a`, `~a`, `#a` (lines 175/180/181). (4) `getmetatable`/`debug.getmetatable`/`debug.setmetatable` only recognized `number_metatable` for the shared per-basic-type metatable, not booleans or nil - added `boolean_metatable`/`nil_metatable` alongside it so `debug.setmetatable(true, mt)`/`debug.setmetatable(nil, mt)` and the following `__index`/`__add` dispatch through them work (lines 481-496). With all four fixed, the file runs to completion (prints `OK`, `return 12`). This note's prior claim that line 196's `assert(not pcall(rawlen, io.stdin))` still diverges (Sol's `io.stdin` being a plain Lua table, not a distinct userdata representation) was stale: `io.stdin` was separately given a real full-userdata representation (`LuaRuntime::new_userdata`/`file_userdata`, `init.rs`) as part of U6's broader native-`io` work, so `rawlen` now correctly rejects it via `pcall` exactly like the oracle. Re-diffed against the pinned `/opt/homebrew/bin/lua5.5` (`Lua 5.5.1`) oracle: stdout is now byte-identical except for one trailing line, `sol run`'s own documented echo of the top-level chunk's return value (`12`) - the same pre-existing, deliberate CLI artifact already documented on `literals.lua`/`verybig.lua`'s entries, not specific to this file. `status` stays `\"diverges\"` (not `\"pass\"`) for that one reason alone; every assertion in the file, including the `rawlen(io.stdin)` case, now passes."

