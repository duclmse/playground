# Lua 5.5.1 top-level test inventory.
#
# This is intentionally a small TOML subset read by scripts/test-lua55-suite.sh.
# Every *.lua file in the upstream checkout must have exactly one [[case]] row.
# `pending` means a Sol language/runtime feature is missing. `host-required`
# means the upstream test exercises an executable, C API, native module, or
# filesystem/locale capability that Sol has not elected to expose.

version = 1
upstream = "Lua 5.5.1"

[[case]]
path = "all.lua"
category = "distribution-driver"
status = "host-required"
requires = ["standalone-cli", "c-api", "native-modules", "filesystem", "locale", "readline"]
note = "Drives the distribution suite and validates the reference executable environment."

[[case]]
path = "api.lua"
category = "c-api"
status = "host-required"
requires = ["c-api", "ltests"]
note = "Exercises Lua's internal C API test library."

[[case]]
path = "attrib.lua"
category = "attributes-and-close"
status = "host-required"
requires = ["native-modules"]
note = "Following up on the prior note's parser-correctness gap (`parse_postfix` absorbing a following `(function...)(1)` onto a preceding table constructor, line ~528): that was fixed separately (restricting postfix call/index/field suffixes to real `prefixexp` roots), so this file now runs well past that point. Two further, genuine interpreter bugs surfaced and are now fixed: (1) `require`'s already-loaded check compared `package.loaded[name]` against `Nil` instead of using Lua truthiness, so a module whose loader legitimately caches `false` (this file's 'default option' reload test, `try('K', 'L', false, ...)`) was wrongly treated as permanently loaded instead of reloaded, unlike real Lua's `ll_require` (`lua_toboolean` check in `loadlib.c`); `require` now reloads on a falsy cached value, exactly matching real Lua. (2) A bare (non-`local`) `_ENV = {}` reassignment inside a `load`-compiled chunk (this file's env-reset tests) compiled as an ordinary `SetGlobal(\"_ENV\", ...)`, which only stashed a spurious `_ENV` table key into the *shared* globals table without changing what subsequent plain names in that chunk resolved against, so later global writes leaked into the caller's real globals instead of the chunk's own replacement table - real Lua treats `_ENV` as an always-present implicit upvalue, and a bare reassignment replaces that chunk's own upvalue cell only. Fixed with a new `Instr::SetEnvironment` bytecode op (`crates/sol/src/lua_bytecode/instr.rs`) that replaces the current frame's `Globals` in place, emitted by `emit_environment_set` (`crates/sol/src/lua_bytecode/compile_calls.rs`) specifically for a bare, non-declaring `_ENV` assignment that has no existing lexical local/upvalue - `local _ENV = ...` and Sol's own `global _ENV = ...` declaration keyword are unaffected. With both fixed, plus the file-backed `require`/`package.preload`/`package.searchpath`/`package.searchers`-type-check/`io.output`/`io.write`/`io.close`/`os.remove` support from the prior session, this file now runs correctly through every `package`/`require`/multiple-assignment/`io`/`os` section - verified against the pinned `lua5.5.1` binary from within `lua-5.5.1-tests/` (with the corpus's own prebuilt `libs/*.so` test modules present). blocked-on: line 337's unconditional `require\"lib2-v2\"` inside the file's 'testing external strings' block, which runs regardless of whether the earlier `package.loadlib` probe succeeded and unconditionally needs a genuine native (`.so`) C-module loaded via `package.cpath` - Sol has no dynamic C-module loader on any platform by design (`Capabilities::native_modules`, `AGENTS.md`'s sandboxing guidance), so this raises a clear, distinct 'Sol has no dynamic C-module loader' error rather than silently succeeding or misreporting the real match as absent. This is a permanent, principled capability gap, not a missing language/runtime feature - hence `host-required`/`native-modules` rather than `pending`."

[[case]]
path = "big.lua"
category = "stress"
status = "diverges"
requires = []
budget = 10000000
note = "`require\"debug\"` now succeeds (a minimal debug library is registered), so this reaches the file's real large-table stress test, which surfaced two genuine bugs fixed alongside this note: a table constructor with more elements than fit in a register-count-sized counter (this file builds one with ~2^18+1000 elements) allocated one register per element without ever recycling them, overflowing `Reg` (`u16`) and panicking - table-constructor field registers are now freed back to the table's own register right after each field is stored; and `load(chunk, name, mode, env)`'s fourth argument was entirely ignored, so a custom `_ENV` table's reads/writes silently went to the real globals instead - `load` now compiles the chunk against that table via `Globals::from_table`. A third, unrelated bug this file's *first* loop (`prog[#prog + 1] = i`, `lim` times) exposed and which is now fixed: `#t` was an O(n) linear scan per call instead of real Lua's O(1)-for-the-common-case/O(log n) border search, making any `t[#t + 1] = v` append loop O(n^2) - this alone was causing multi-minute hangs on this file (and likely elsewhere) at larger instruction budgets. Two more bugs the file's `env`-metatable section then surfaced, both now fixed: global reads/writes compiled from a chunk with a custom `_ENV` (via `load`'s fourth argument) bypassed that table's metatable entirely, so the `__index`/`__newindex` metamethods this file installs on `env` never fired - global access now routes through `index_resolve`/`set_index_resolve` (the same metamethod-resolution path ordinary table indexing uses) whenever the `_ENV` table has a metatable; and a `__newindex` metamethod body that itself errors produced an unnamed, unhelpful traceback, because (a) `debug.traceback` was entirely unimplemented, and (b) even a `debug.getinfo`-based traceback would not have known the erroring call originated from a metamethod dispatch - both are fixed via a minimal `debug.traceback` native plus new runtime bookkeeping (`pending_frame_label`/`entry_label`/`pending_error_stack`) that tags a frame pushed to run an `__index`/`__newindex` body and threads an \"in metamethod '...'\" annotation onto the propagating error's stack trail, mirroring `ldebug.c`'s naming for table-access-triggered calls. With all of the above fixed, standalone execution now correctly reaches this file's own top-level `coroutine.yield'b'` (line 56) and fails there with \"attempt to yield from outside a coroutine\" - verified byte-for-byte against the pinned real `lua5.5.1` binary, which fails identically at the same line with the same stdout/stderr/exit status when run the same way. This is not a Sol bug: `lua-5.5.1-tests/all.lua` (the upstream driver) deliberately runs this file only via `coroutine.wrap(assert(loadfile('big.lua')))`, precisely because of that yield; a bare `sol run`/`lua5.5 big.lua` invocation is never the file's intended entry point. `status = \"diverges\"` records that intentional invocation-model gap (standalone vs. coroutine-wrapped) rather than a missing feature; the migration path is a coroutine-wrapped fixture (mirroring `all.lua`) if/when this file's stress assertions need to run to completion in CI."

