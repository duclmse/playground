note = "The prior note's claim that line 271's `local t = {unpack(s)}` needs a bare global `unpack` was stale/wrong: line 47's file-scope `local unpack = table.unpack` is an ordinary enclosing local, still in scope inside the later `perm` closure (no intervening `do...end` ends a chunk-level local's scope) - re-verified against the pinned `lua5.5.1` binary, which also runs this file standalone to completion (`OK`), so this was never a real blocker. Past that, two genuine bugs surfaced and are now fixed: (1) `table.sort(t, nil)` (an explicit `nil` comparator, as opposed to omitting the argument) was treated as \"a comparator is present\" and Sol tried to call `nil`, instead of falling back to the default `<` order like omitting the argument does - fixed in both the blocking `call_native_table` arm and the resumable fast-path trampoline (`dispatch.rs`) by filtering an explicit-`Nil` comparator argument the same as an absent one. (2) `table.sort` was an O(n^2) insertion sort (both the blocking arm and the resumable `sort_step`/`SortState` driver), taking ~60 seconds on this file's 50,000-element stress case and then exhausting the instruction budget on the very next (already-sorted re-sort) call - replaced with a real median-of-three-pivot Hoare-partition quicksort (mirroring `ltablib.c`'s `auxsort`/`partition`, including its partition-boundary \"invalid order function for sorting\" detection), keeping the resumable version's exact same step-by-step `NeedsCall`/resume calling convention (`SortPhase` in `frame.rs`) so a comparator call still never blocks native Rust recursion or a coroutine yield. With both fixed, this file now runs to completion and prints `OK`, matching the oracle on every assertion; `status = \"diverges\"` (not `pass`) because the file also prints non-deterministic `os.clock()`-timed `msec.`/comparison-count lines that can never byte-diff identically against a freshly-run oracle even when both are behaving correctly - `budget`/`alloc_budget` are raised because this file's own multiple full 50,000-element sorts (random, already-sorted, inverse-order, all-equal) need far more than the sandboxed-embedder defaults (1,000,000 instructions / 64MiB) to run to completion at all, not because of any remaining performance bug."

