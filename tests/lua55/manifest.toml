[[case]]
path = "calls.lua"
category = "calls"
status = "pass"
requires = []
note = "The prior blocker ('any value is valid for _ENV', line 415 - `assert(load(\"return _ENV\", nil, nil, 123)() == 123)`) is now fixed: `_ENV` is modeled as a real upvalue holding an arbitrary `LuaValue` (`lua_runtime/value.rs`'s `Globals`/`GlobalsInner` now wrap a `RefCell<LuaValue>` via `Globals::from_value`/`set_value`, not an `RcRef<LuaTable>`-only representation), and `natives_load.rs`'s `load`/`compile_chunk`/`compile_chunk_named`/`load_binary_chunk` accept any `LuaValue` for the `env` argument instead of requiring a table. The following section ('load when _ENV is not first upvalue', line ~418) also passes: `debug.getupvalue`/`debug.setupvalue` expose a closure's implicit final `_ENV` upvalue slot (`natives_debug.rs`'s `has_implicit_environment` helper scans a `Proto` for `GetEnvironment`/`SetEnvironment`/`GetGlobal`/`SetGlobal` to locate it). Everything before that line in the 'test for generic load' section already passed (see the prior note's detail on `debug.getinfo(a).source`, `load`'s mode argument, `string.dump`, and the parser's 'unexpected symbol' wording) and continues to. With both fixed, the unmodified upstream file runs to completion and prints `OK`; verified byte-for-byte against the pinned `/opt/homebrew/bin/lua5.5` (`Lua 5.5.1`) oracle when run standalone from within `lua-5.5.1-tests/`, modulo `sol run`'s own unrelated trailing implicit-chunk-return-value print. `debug.getinfo`'s `extraargs` field and the O(1) tail-call/iterative resolution of chained `__call` metamethods (`step_result_for_call`, `MAX_CALL_CHAIN`) continue to cover 'testing chains of __call' (line 195) and 'C-stack overflow while handling C-stack overflow' (line 160)."

[[case]]
path = "closure.lua"
category = "closures"
status = "pass"
requires = []
note = "Previously blocked at line ~140: a loop-body local captured as an upvalue by a nested closure could be re-assigned the SAME register number as an earlier-compiled, textually-preceding scratch temp within the same loop body (e.g. a `while` guard condition), because ordinary stack-discipline register recycling only protected *already-captured* registers (`retired_floor`) going forward, not registers a still-open loop had used earlier in its own body. Fixed by adding `LoopCtx.reg_floor` (`lua_bytecode/func_state.rs`): the highest register any `alloc_reg` call has handed out anywhere in the current loop's body, which now also floors `reset_to`/`pop_scope`/`end_statement`'s recycling for as long as that loop is being compiled. Also required precisely fixing the top-level `function NAME(...) end` chunk-statement hoisting decision in `parser.rs`: it now hoists into the independently-compiled `functions` list (which can never capture a chunk-scope local as an upvalue) only when the function's name doesn't rebind a preceding chunk-local and a conservative free-variable scan of its body finds no reference to one; otherwise it stays a sequential `Stmt::GlobalFunction` chunk statement, matching real Lua's assignment-sugar semantics for `function NAME(...) end`. Oracle-backed: matches the pinned reference `lua5.5.1` byte-for-byte (aside from Sol's documented top-level return echo) when run standalone from within `lua-5.5.1-tests/`."

