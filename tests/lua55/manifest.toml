note = "blocked-on: the former line-141 blocker (`os.tmpname` was entirely unimplemented) is now fixed - it creates a real, empty, unique temp file via `std::fs::File::create` under a monotonic per-runtime counter, matching real Lua's `mkstemp`/`tmpnam`-backed semantics; `io.output`/`io.close`/`os.remove` were already implemented and working (the prior note's claim they were 'also nil' was inaccurate/unverified). That, in turn, uncovered a second real bug, also now fixed: `dofile(path)` only ever consulted Sol's in-memory `module_sources` map (for embedders that pre-register modules without a real filesystem) and had no real-filesystem fallback at all, even when the `filesystem` capability was granted - unlike `require`, which already reads real files via `package.path` when not found in-memory. This broke `dofile(file)` at line 148 on the freshly-`os.tmpname()`-created file, which is never a pre-registered in-memory module. Fixed by giving `dofile` the same real-file fallback `require`'s loader already has (`std::fs::read` gated on `Capabilities::filesystem`) in both of its two implementations - the blocking `call_native` arm (`natives_load.rs`) and the non-blocking trampoline arm used when `dofile` is actually invoked through the dispatch loop (`dispatch.rs`) - the two had drifted out of sync, and only the second was actually exercised by this file's call path. With both fixed, the case now runs to completion and prints `OK` (returning `10`), byte-identical to the pinned oracle, under an elevated `SOL_LUA_INSTRUCTION_BUDGET` override - but `sol run`'s default embedder-sized instruction budget (1,000,000, sized for untrusted code) is exhausted mid-file at line 118, inside the first ~50,000-iteration `io.write`-generation loop that builds the >64KB program body this file stress-tests. This is the same orthogonal, pre-existing budget-sizing gap documented on `nextvar.lua`'s case, not a compatibility bug, so this case stays `pending` (which the corpus runner exercises