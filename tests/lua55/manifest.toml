note = "Oracle-backed: unchanged Lua 5.5.1 case matches the pinned reference after fixing a chain of differential bugs found while chasing this file: hex-float mantissa overflow for very long numerals (the lexer now caps mantissa accumulation at 30 significant digits and folds the rest into a corrective exponent, matching `lua_strx2number`); catastrophic-cancellation precision loss in the float `%` operator for large magnitudes (now `fmod` plus `luai_nummod`'s sign correction instead of `a - floor(a/b)*b`); `\"expected number\"`/`\"expected string\"` coercion-error wording transposed relative to real Lua's own `\"number expected\"`/`\"string expected\"`; `math.tointeger` not accepting a numeral string (`minint .. \"\"`, `\"34.0\"`) the way arithmetic coercion does; `i64::MAX as f64` rounding up to `2^63` making both `math.tointeger` and table-key float normalization wrongly accept one-past-maxinteger as an integer; `math.max`/`math.min` comparing arguments via lossy `f64` conversion instead of exact int/float comparison (`math.max(minint, minint+1)` returned `minint`); and float-to-string conversion being Rust's plain `f64::to_string` (no scientific notation, no Lua's `.0` float marker) instead of a shortest-round-trip digit string formatted with real Lua's `%g`-style plain/scientific rule. `math.random`'s statistical distribution checks are bounded but instruction-heavy, past the CLI's 1,000,000-instruction default (deliberately conservative for untrusted embedders); rather than raising that shared default - which a separate investigation found lets an unrelated, already-`pending` stress case (`big.lua`) run for minutes instead of failing fast - this case gets its own elevated `budget` (verified stable across 5+ repeated runs; real seeds vary but the loop retries via `goto doagain` until its statistics pass)."

