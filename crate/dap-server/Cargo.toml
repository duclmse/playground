[package]
name = "dap-server"
version = "0.1.0"
edition = "2021"
description = "Native Debug Adapter Protocol server over the lua-vm DebugSession, for VS Code / any DAP client."

[[bin]]
name = "dap-server"
path = "src/main.rs"

[dependencies]
# Native path dependency on the same DebugSession the browser debugger
# uses via wasm - see docs/dap-server.md for why this works unmodified
# (lua-vm builds as an rlib too, and its #[wasm_bindgen] attributes no-op
# on a non-wasm32 target).
lua-vm = { path = "../lua-vm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
