[package]
name = "sol"
version = "0.1.0"
edition = "2021"
description = "A typed, Lua-compatible language compiled straight to native code via Cranelift. See docs/sol.md."

[lib]
name = "sol"
crate-type = ["rlib", "staticlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "sol"
path = "src/main.rs"
required-features = ["jit"]

[dependencies]
anyhow = "1"
sol-core = { path = "../sol-core" }
cranelift-codegen = { version = "0.134", optional = true }
cranelift-frontend = { version = "0.134", optional = true }
cranelift-jit = { version = "0.134", optional = true }
cranelift-module = { version = "0.134", optional = true }
cranelift-object = { version = "0.134", optional = true }
cranelift-native = { version = "0.134", optional = true }
indexmap = "2"

[features]
default = ["jit"]
# Native Cranelift JIT/AOT compilation (aot.rs, codegen.rs, jit.rs, tier.rs)
# and the `sol` CLI binary. Not available on wasm32-unknown-unknown: the
# `region` dependency of cranelift-jit has no wasm32 branch, since you
# cannot mark WASM linear memory executable. A `--no-default-features`
# build keeps the shared front end and Tier-0 bytecode interpreter
# (lexer/parser/typeck/bccompile/interp) buildable for wasm32 hosts - see
# docs/features/milestones/u12-wasm-playground.md.
jit = [
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-jit",
  "dep:cranelift-module",
  "dep:cranelift-object",
  "dep:cranelift-native",
]

[dev-dependencies]
